<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="text-scale" content="scale">
    <!-- The runner is dark-only; declaring it up front keeps native controls,
         scrollbars, and the initial canvas dark instead of flashing light. -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0d0f17">
    <title>Modern Web Guidance Eval Runner</title>
    <link rel="stylesheet" href="eval-ui.css">
    <!-- Font files come from a second origin, so warm up both connections. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
    <div class="glass-orb orb-1"></div>
    <div class="glass-orb orb-2"></div>

    <div class="dashboard-container">
        <header class="fancy-header">
            <div class="header-text">
                <div class="logo">Modern Web Guidance <span>Eval Runner</span></div>
                <p>Set configurations, interactively select tasks, and run an evaluation.</p>
            </div>
            <button type="submit" class="btn-primary" id="launch-btn-header" form="launch-form">
                <span>Start Evaluation</span>
                <svg class="run-icon" viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </header>

        <form id="launch-form">
            <section class="config-grid">
                <div class="glass-panel">
                    <h3>Suite Configuration</h3>
                    <div class="input-group">
                        <label for="name">Suite Name (Optional)</label>
                        <input type="text" id="name" placeholder="Leave empty for auto-generated name">
                    </div>
                    <div class="row">
                        <div class="input-group" style="flex: 0 0 auto;">
                            <label for="numRuns">Number of Runs</label>
                            <input type="number" id="numRuns" value="1" min="1">
                        </div>
                        <div class="input-group" style="flex: 0 0 auto;">
                            <label for="workerCount">Worker Count</label>
                            <input type="number" id="workerCount" placeholder="Auto" min="1">
                        </div>
                        <!-- Native radios give the agent choice real state and arrow-key
                             navigation; the fieldset/legend names the group. -->
                        <fieldset class="input-group">
                            <legend>Agent</legend>
                            <div class="btn-toggle-group" id="agent-group">
                                <label class="btn-toggle"><input type="radio" name="agent" value="antigravity_cli" checked>Antigravity CLI</label>
                                <label class="btn-toggle"><input type="radio" name="agent" value="jetski_cli">Jetski CLI</label>
                                <label class="btn-toggle"><input type="radio" name="agent" value="gemini_cli">Gemini CLI</label>
                                <label class="btn-toggle"><input type="radio" name="agent" value="claude_code">Claude Code</label>
                                <label class="btn-toggle"><input type="radio" name="agent" value="codex_cli">Codex CLI</label>
                            </div>
                        </fieldset>
                    </div>
                    
                    <div class="row" style="margin-top: 1.5rem; align-items: flex-start;">
                        <fieldset class="input-group" style="flex: 1;">
                            <legend>Skills to Enable</legend>
                            <div class="skills-container" id="skills-container" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.5rem;">
                                <!-- Skill switches will be injected here -->
                            </div>
                        </fieldset>
                    </div>
                </div>
            </section>

            <div class="panel-header">
                <h3>Task Selector</h3>
            </div>

            <section class="tasks-section" style="margin-top: 0;">
                <div class="glass-panel">
                    <div class="panel-header">
                        <h3 id="guide-header">Guide Tasks</h3>
                        <div class="quick-actions">
                            <button type="button" class="btn-secondary" id="action-clear-guides">Clear All</button>
                        </div>
                    </div>

                    <div class="table-container">
                        <table id="tasks-table">
                            <thead>
                                <tr id="table-headers">
                                    <th>Guide</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Grouped tasks go here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <div class="footer-actions">
                <p id="form-error" class="form-error" role="alert" hidden></p>
                <button type="submit" class="btn-primary" id="launch-btn">
                    <span>Start Evaluation</span>
                    <svg class="run-icon" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <script type="module" src="eval-ui.js"></script>
</body>
</html>
