<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Modern Web Guidance Eval Runner</title>
    <link rel="stylesheet" href="eval-ui.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
</head>
<body>
    <a href="#main-content" class="skip-link visually-hidden">Skip to main content</a>
    <div class="glass-orb orb-1" aria-hidden="true"></div>
    <div class="glass-orb orb-2" aria-hidden="true"></div>

    <div class="dashboard-container">
        <header class="fancy-header">
            <div class="header-text">
                <h1 class="logo">Modern Web Guidance <span>Eval Runner</span></h1>
                <p>Set configurations, interactively select tasks, and run an evaluation.</p>
            </div>
            <button type="submit" class="btn-primary" id="launch-btn-header" form="launch-form">
                <span>Start Evaluation</span>
                <svg class="run-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </header>

        <main id="main-content" tabindex="-1">
            <form id="launch-form">
                <section class="config-grid">
                    <div class="glass-panel">
                        <h2>Suite Configuration</h2>
                        <div class="input-group">
                            <label for="name">Suite Name (Optional)</label>
                            <input type="text" id="name" placeholder="Leave empty for auto-generated name">
                        </div>
                        <div class="row">
                            <div class="input-group input-group-auto">
                                <label for="numRuns">Number of Runs</label>
                                <input type="number" id="numRuns" value="1" min="1">
                            </div>
                            <div class="input-group input-group-auto">
                                <label for="workerCount">Worker Count</label>
                                <input type="number" id="workerCount" placeholder="Auto" min="1">
                            </div>
                            <fieldset class="input-group fieldset-reset">
                                <legend>Agent</legend>
                                <div class="btn-toggle-group" id="agent-group">
                                    <button type="button" class="btn-toggle active" data-value="antigravity_cli" aria-pressed="true">Antigravity CLI</button>
                                    <button type="button" class="btn-toggle" data-value="jetski_cli" aria-pressed="false">Jetski CLI</button>
                                    <button type="button" class="btn-toggle" data-value="gemini_cli" aria-pressed="false">Gemini CLI</button>
                                    <button type="button" class="btn-toggle" data-value="claude_code" aria-pressed="false">Claude Code</button>
                                    <button type="button" class="btn-toggle" data-value="codex_cli" aria-pressed="false">Codex CLI</button>
                                </div>
                                <input type="hidden" id="agent" value="antigravity_cli">
                            </fieldset>
                        </div>

                        <div class="row row-skills">
                            <fieldset class="input-group fieldset-reset">
                                <legend>Skills to Enable</legend>
                                <div class="skills-container" id="skills-container">
                                    <!-- Skill buttons will be injected here -->
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </section>

                <div class="panel-header">
                    <h2>Task Selector</h2>
                </div>

                <section class="tasks-section tasks-section-flush">
                    <div class="glass-panel">
                        <div class="panel-header">
                            <h3 id="guide-header">Guide Tasks</h3>
                            <div class="quick-actions">
                                <button type="button" class="btn-secondary" id="action-clear-guides">Clear All</button>
                            </div>
                        </div>

                        <div class="table-container">
                            <table id="tasks-table">
                                <caption class="visually-hidden">Evaluation tasks grouped by guide category</caption>
                                <thead>
                                    <tr id="table-headers">
                                        <th scope="col">Guide</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Grouped tasks go here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <div class="footer-actions">
                    <button type="submit" class="btn-primary" id="launch-btn">
                        <span>Start Evaluation</span>
                        <svg class="run-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script src="eval-ui.js"></script>
</body>
</html>
