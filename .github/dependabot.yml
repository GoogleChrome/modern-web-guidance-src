# Noise reduction strategy:
# 1. Weekly updates on Sundays to avoid daily interruptions.
# 2. Group minor and patch updates into a single PR per project (major updates ignored).
# 3. Limit total open PRs to prevent backlog accumulation.

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/serving"
      - "/harness"
      - "/harness/base_apps/devtools-times"
      - "/guides"
      - "/eval-view"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 3
    versioning-strategy: "increase"
    ignore:
      # Handled by dedicated updater workflow: .github/workflows/update-web-features.yml
      - dependency-name: "web-features"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
      # Fast-moving AI SDKs/CLIs that need immediate updates
      exclude:
        - "@anthropic-ai/*"
        - "@openai/*"
    groups:
      everything:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
