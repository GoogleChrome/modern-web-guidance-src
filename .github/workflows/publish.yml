name: Publish Skills

on:
  schedule:
    # 20:00 UTC is 12:00 PM PST / 1:00 PM PDT
    - cron: '0 20 * * 1'
  workflow_dispatch: {}

concurrency:
  group: publish-skills
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Required for npm OIDC provenance when enabled

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes since last release
        run: |
          if git describe --exact-match --match "v*" HEAD >/dev/null 2>&1; then
            echo "Error: The latest commit already has a version tag. No new changes to publish."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build distribution
        run: pnpm --filter serving run build

      - name: Verify installation with install-skills test
        env:
          FULL: 1
          TEST_REPORTER: spec
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm --filter serving exec node --test skills-cli/install-skills.test.ts



      - name: Configure Git for Auth and Commit
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rewrite SSH to HTTPS using the App token for the target repo
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Publish Skills to GitHub (modern-web-guidance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter serving run publish-skills

      - name: Commit and push README.md to source repo
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs: auto-update recent evals and skill coverage in README.md [skip ci]"
            git push origin HEAD:"$GITHUB_REF"
          else
            echo "No changes in README.md to commit."
          fi

      - name: Publish to npm via OIDC Provenance
        run: |
          cd dist/skills-cli
          npm publish --provenance --access public --registry https://registry.npmjs.org/
