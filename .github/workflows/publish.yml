name: Publish Skills

on:
  schedule:
    # Every 12 hours: 14:50 UTC (6:50 AM PST) and 02:50 UTC (6:50 PM PST)
    - cron: '50 2,14 * * *'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag and GitHub branch target (next or latest)'
        required: false
        default: 'next'
        type: choice
        options:
          - next
          - latest
      version:
        description: 'Optional explicit version override (e.g. 1.0.0; leave blank to auto-increment)'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: publish-skills
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'GoogleChrome/modern-web-guidance-src'
    permissions:
      contents: write
      issues: write
      id-token: write # Required for npm OIDC provenance when enabled

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},modern-web-guidance
          permission-contents: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] publish-skills.ts pushes the release commit and tag using this persisted App token
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check for changes since last release
        id: check-changes
        env:
          DIST_TAG: ${{ inputs.dist_tag || 'next' }}
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: |
          if [ -n "${RELEASE_VERSION}" ]; then
            CLEAN_VER="${RELEASE_VERSION#v}"
            if git rev-parse "v${CLEAN_VER}" >/dev/null 2>&1; then
              echo "Error: Tag v${CLEAN_VER} already exists."
              exit 1
            fi
            echo "Explicit version v${CLEAN_VER} requested (${DIST_TAG}). Proceeding."
            exit 0
          fi

          if [ "${DIST_TAG}" = "next" ] && git describe --exact-match --match "v*" HEAD >/dev/null 2>&1; then
            EXISTING_TAG=$(git describe --exact-match --match "v*" HEAD)
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "HEAD is already tagged (${EXISTING_TAG}). Skipping scheduled @next publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Error: The latest commit already has a version tag (${EXISTING_TAG}). No new changes to publish."
            exit 1
          fi

      - name: Setup pnpm
        if: steps.check-changes.outputs.skip != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        if: steps.check-changes.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        if: steps.check-changes.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        if: steps.check-changes.outputs.skip != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_EVALS_COLLECTOR_SA_KEY }}

      - name: Collect latest evaluation results from GCS
        if: steps.check-changes.outputs.skip != 'true'
        id: collect-evals
        continue-on-error: true
        run: pnpm run collect-evals

      - name: Handle eval collection fallback on failure
        if: steps.check-changes.outputs.skip != 'true' && steps.collect-evals.outcome != 'success'
        run: |
          echo "::warning title=Eval Collection Skipped::Evaluation collection or regression test failed. Discarding uncommitted summary and proceeding with previous stable eval data."
          echo "### ⚠️ Evaluation Collection Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Evaluation collection or regression tests encountered an issue. Discarding changes to \`eval-results-summary.json\` and proceeding with publish using previous data." >> $GITHUB_STEP_SUMMARY
          git checkout -- src/build/eval-results-summary.json || true

      - name: Build distribution
        if: steps.check-changes.outputs.skip != 'true'
        run: pnpm run build

      - name: Verify installation with install-skills test
        if: steps.check-changes.outputs.skip != 'true'
        env:
          FULL: 1
          TEST_REPORTER: spec
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node --test src/cli/install-skills.test.ts



      - name: Configure Git for Auth and Commit
        if: steps.check-changes.outputs.skip != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rewrite SSH to HTTPS using the App token for the target repo
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Publish Skills to GitHub (modern-web-guidance)
        if: steps.check-changes.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NPM_DIST_TAG: ${{ inputs.dist_tag || 'next' }}
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: pnpm run publish-skills

      - name: Publish to npm via OIDC Provenance
        if: steps.check-changes.outputs.skip != 'true'
        env:
          DIST_TAG: ${{ inputs.dist_tag || 'next' }}
        run: |
          cd dist/skills-cli
          npm publish --provenance --access public --tag "${DIST_TAG}" --registry https://registry.npmjs.org/
          if [ "${DIST_TAG}" = "latest" ]; then
            PUBLISHED_VERSION=$(node -p "require('./package.json').version")
            npm dist-tag add "modern-web-guidance@${PUBLISHED_VERSION}" next --registry https://registry.npmjs.org/ || true
          fi

      - name: Notify on failure
        if: failure() && steps.check-changes.outcome != 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create \
            --title "Publish Skills workflow failed (run #$GITHUB_RUN_NUMBER)" \
            --assignee "TravenReese,micahjo7,paulirish" \
            --body "The [Publish Skills workflow run]($RUN_URL) failed."$'\n\n'"cc @TravenReese @micahjo7 @paulirish"
