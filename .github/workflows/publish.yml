name: Publish Skills

on:
  schedule:
    # Weekly on Monday at 14:50 UTC (6:50 AM PST / 7:50 AM PDT) - publishes @latest
    - cron: '50 14 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit version override (e.g. 1.0.0; leave blank to auto-increment)'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: publish-skills
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'GoogleChrome/modern-web-guidance-src'
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.preflight.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Preflight release check
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version || '' }}
        run: |
          if [ -n "${RELEASE_VERSION}" ]; then
            CLEAN_VER="${RELEASE_VERSION#v}"
            if ! [[ "${CLEAN_VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid explicit version '${RELEASE_VERSION}'. Expected X.Y.Z semver."
              exit 1
            fi
            if git rev-parse "v${CLEAN_VER}" >/dev/null 2>&1; then
              echo "::error::Tag v${CLEAN_VER} already exists."
              exit 1
            fi
            echo "Explicit version v${CLEAN_VER} requested. Proceeding."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALREADY_RELEASED=""
          LATEST_RELEASE_TAG=$(gh release view -R GoogleChrome/modern-web-guidance --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "${LATEST_RELEASE_TAG}" ] && [ "$(git rev-parse -q --verify "refs/tags/${LATEST_RELEASE_TAG}^{commit}" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
            ALREADY_RELEASED="${LATEST_RELEASE_TAG}"
          fi

          if [ -n "${ALREADY_RELEASED}" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "HEAD is already tagged (${ALREADY_RELEASED}). Skipping scheduled publish."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::The latest commit already has a release tag (${ALREADY_RELEASED}). No new changes to publish."
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || '' }}
    permissions:
      contents: write
      issues: write
      id-token: write # Required for npm OIDC provenance when enabled

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},modern-web-guidance
          permission-contents: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] publish-skills.ts pushes the release commit and tag using this persisted App token
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_EVALS_COLLECTOR_SA_KEY }}

      - name: Collect latest evaluation results from GCS
        id: collect-evals
        continue-on-error: true
        run: pnpm run collect-evals

      - name: Handle eval collection fallback on failure
        if: steps.collect-evals.outcome != 'success'
        run: |
          echo "::warning title=Eval Collection Skipped::Evaluation collection or regression test failed. Discarding uncommitted summary and proceeding with previous stable eval data."
          echo "### ⚠️ Evaluation Collection Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Evaluation collection or regression tests encountered an issue. Discarding changes to \`eval-results-summary.json\` and proceeding with publish using previous data." >> $GITHUB_STEP_SUMMARY
          git checkout -- src/build/eval-results-summary.json || true

      - name: Build distribution
        run: pnpm run build

      - name: Verify installation with install-skills test
        env:
          FULL: 1
          TEST_REPORTER: spec
        run: node --test src/cli/install-skills.test.ts

      - name: Configure Git for Auth and Commit
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rewrite SSH to HTTPS using the App token for the target repo
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Publish Skills to GitHub (modern-web-guidance)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pnpm run publish-skills

      - name: Publish to npm via OIDC Provenance
        run: |
          cd dist/skills-cli
          npm publish --provenance --access public --tag latest --registry https://registry.npmjs.org/

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue create \
            --title "Publish Skills workflow failed (run #$GITHUB_RUN_NUMBER)" \
            --assignee "TravenReese,micahjo7,paulirish" \
            --body "The [Publish Skills workflow run]($RUN_URL) failed."$'\n\n'"cc @TravenReese @micahjo7 @paulirish"
