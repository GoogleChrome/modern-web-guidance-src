name: Content ATL Triage

on:
  issues:
    types: [opened, labeled, assigned]
  # Using `pull_request_target` allows the workflow to run with write permissions
  # even for PRs from forks, enabling automated labeling and reviewer requests.
  # Trusted code from `main` is checked out and executed, while PR content is
  # fetched via the GitHub API.
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Run ATL triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --experimental-strip-types guides/atl-triage.ts
