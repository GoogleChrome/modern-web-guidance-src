name: Daily web-features Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Update web-features across workspaces
        run: |
          pnpm update --recursive web-features

      - name: Generate GitHub App token
        if: ${{ vars.GH_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request if web-features changed
        uses: peter-evans/create-pull-request@c5a2204359f14352f2f4c9c1b3f94a8c3d8e578c # v7.0.5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): bump web-features package daily"
          title: "chore(deps): bump web-features package"
          body: |
            Daily automated check for `@web-platform-dx/web-features` updates across `/`, `/serving`, and `/guides`.
            
            CI workflow checks will automatically run on this PR to report if any guidance macros, tests, or features require updates.
          branch: "auto/daily-web-features"
          delete-branch: true
