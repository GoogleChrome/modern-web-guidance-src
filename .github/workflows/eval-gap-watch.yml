name: Eval Gap Watch

on:
  # Any of these can open or close an issue: guidance/expectations can create
  # gaps, and grader/task changes (legacy or targets layout) can resolve them.
  push:
    branches: [main]
    paths:
      - 'guides/**/guide.md'
      - 'guides/**/expectations.md'
      - 'guides/**/grader.ts'
      - 'guides/**/task.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry run mode'
        required: true
        default: 'true'
        type: boolean

permissions:
  contents: read
  issues: write

# This job reads the existing issues and then writes new ones, so parallel runs
# could both see an empty list and file the same issue twice. Serialize them,
# and never cancel an in-flight run, which could leave issues half-filed.
# GitHub keeps at most one pending run per group, so a burst of pushes can drop
# a waiting run's expectations check; missing-evals is recomputed next run.
concurrency:
  group: eval-gap-watch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watch:
    runs-on: ubuntu-latest
    if: github.repository == 'GoogleChrome/modern-web-guidance-src'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed so the push's "before" commit is available to diff against.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eval gap watch
        run: node --experimental-strip-types guides/eval-gap-watch.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Empty on manual runs, which then only check for missing evals.
          EVAL_GAP_BEFORE: ${{ github.event.before }}
