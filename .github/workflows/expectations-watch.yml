name: Expectations Watch

on:
  push:
    branches: [main]
    paths:
      - 'guides/**/expectations.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry run mode'
        required: true
        default: 'true'
        type: boolean

permissions:
  contents: read
  issues: write

# This job reads the existing issues and then writes new ones, so parallel runs
# could both see an empty list and file the same issue twice. Serialize them,
# and never cancel an in-flight run, which could leave issues half-filed.
concurrency:
  group: expectations-watch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watch:
    runs-on: ubuntu-latest
    if: github.repository == 'GoogleChrome/modern-web-guidance-src'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed so the push's "before" commit is available to diff against.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run expectations watch
        run: node src/ci/expectations-watch.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          EXPECTATIONS_WATCH_BEFORE: ${{ github.event.before }}
