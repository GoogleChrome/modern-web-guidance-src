<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dark Mode Toggle: Interactive Demo</title>

  <!-- MANDATORY: declare both schemes early so the browser themes the canvas before CSS parses. -->
  <meta name="color-scheme" content="light dark">
  <!--
    FOUC prevention: apply the stored override before first paint.
    Inline, NOT type=module, NOT defer, immediately after the <meta>.
  -->
  <script>
    try {
      document.querySelector('meta[name="color-scheme"]').content =
        localStorage.getItem("color-scheme") ?? "light dark";
    } catch {}
  </script>

  <style>
    :root {
      /* MANDATORY: base stays "light dark" so the site follows the system preference when JS never runs. */
      color-scheme: light dark;

      /* Resolved scheme as a custom property, for non-color branching (see selector-atrule-combinations). */
      --color-scheme: light;

      @media (prefers-color-scheme: dark) {
        --color-scheme: dark;
      }

      /* The <meta> is only a hint: map it back to the property so the override actually takes effect. */
      &:has(> head > meta[name="color-scheme"][content="dark"]) {
        --color-scheme: dark;
        color-scheme: dark;
      }

      &:has(> head > meta[name="color-scheme"][content="light"]) {
        --color-scheme: light;
        color-scheme: light;
      }

      --bg: light-dark(#ffffff, #14181f);
      --fg: light-dark(#14181f, #e8ecf1);
      --muted: light-dark(#5a6472, #97a1b0);
    }


    body {
      margin: 0;
      min-height: 100dvh;
      padding: 2rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      display: grid;
      gap: 1.5rem;
      place-content: start center;
    }

    .card {
      max-width: 40rem;
      padding: 1.5rem;
      border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent);
      border-radius: 12px;
      display: grid;
      gap: 1rem;
    }
    .card h1 {
      /* Non-color branch: lighter weight reads better on dark backgrounds. */
      font-weight: 600;
    }
    @container style(--color-scheme: dark) {
      .card h1 { font-weight: 400; }
    }

    .theme-toggle {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem;
      font: inherit;
      color: inherit;
      background: color-mix(in srgb, var(--fg) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
      border-radius: 999px;
      cursor: pointer;
    }
    .vh {
      position: absolute;
      clip-path: inset(50%);
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    /* The control's own options are non-color branches: show the action for the scheme you'd switch TO. */
    .to-dark, .to-light { display: none; }
    @container style(--color-scheme: light) { .to-dark { display: inline; } }
    @container style(--color-scheme: dark)  { .to-light { display: inline; } }

    input, select { color-scheme: inherit; }
    .status { color: var(--muted); font-size: 0.9rem; }
    code { background: color-mix(in srgb, var(--fg) 10%, transparent); padding: 0.1em 0.35em; border-radius: 4px; }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button">
    <span class="to-dark" aria-hidden="true">🌙</span>
    <span class="to-light" aria-hidden="true">☀️</span>
    <span class="vh to-dark">Switch to dark theme</span>
    <span class="vh to-light">Switch to light theme</span>
    <span aria-hidden="true">Toggle theme</span>
  </button>

  <section class="card">
    <h1>Dark mode toggle</h1>
    <p>Native UI, <code>light-dark()</code> colors and system colors all follow the override below.</p>
    <label>A native control (scheme-aware): <input type="date"></label>
    <select><option>Native dropdown</option><option>adapts too</option></select>
    <p class="status"></p>
  </section>

  <script>
    const meta = document.querySelector('meta[name="color-scheme"]');
    const KEY = "color-scheme";
    const media = matchMedia("(prefers-color-scheme: dark)");

    const read = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
    const systemScheme = () => media.matches ? "dark" : "light";
    // What is actually rendered right now: the override if any, else the system preference.
    const rendered = () => read() ?? systemScheme();

    function apply() {
      meta.content = read() ?? "light dark";
      document.querySelector(".status").textContent =
        `system: ${systemScheme()} · rendered: ${rendered()} · stored override: ${read() ?? "(none)"}`;
    }

    function toggle() {
      // Target = the opposite of what is rendered right now, NOT the inverse of the system default.
      const target = rendered() === "dark" ? "light" : "dark";
      try {
        if (target === systemScheme()) {
          localStorage.removeItem(KEY); // undoing the adjustment — never pin a value that matches the system
        } else {
          localStorage.setItem(KEY, target);
        }
      } catch {}
      apply();
    }

    document.querySelector(".theme-toggle").addEventListener("click", toggle);
    // The system preference can change at any time; a stored override is kept, but the label may need updating.
    media.addEventListener("change", apply);
    // Another tab may change the override.
    addEventListener("storage", e => { if (e.key === KEY) apply(); });

    apply();
  </script>
</body>
</html>
