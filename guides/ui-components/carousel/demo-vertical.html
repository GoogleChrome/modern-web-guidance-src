<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Vertical carousel</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: Canvas;
      --ink: CanvasText;
      --line: color-mix(in srgb, CanvasText, transparent 75%);
      --accent: #0a5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      font: 1rem/1.5 system-ui, sans-serif;
      background: var(--surface);
      color: var(--ink);
    }

    .carousel {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      block-size: min(70vh, 24rem);
    }

    .carousel-track {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      gap: 1rem;
      block-size: 100%;
      border-radius: 0.5rem;
    }

    .carousel-track > * {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: grid;
      place-items: center;
      inline-size: min(16rem, calc(100vw - 8rem));
      border-radius: 0.5rem;
      font-size: 2rem;
      background: color-mix(in srgb, var(--accent), var(--surface) 80%);
      border: 1px solid var(--line);
    }

    /*
     * Looping without clones: at or one step from the first slide, park the last slide before it
     * (order: -1); at or one step from the last slide, park the first slide after it (order: 1). The
     * neighbor is already in place before scrolling reaches an end, so the previous and next buttons never
     * disable. Only the first and last slides ever get `order`.
     * Without support the carousel stays a finite list.
     */
    @supports (order: mod(sibling-index(), 2)) {
      /* --current is deliberately not defined here: without JavaScript no slide is parked, so DOM order applies and the carousel starts on slide 1 */
      .carousel-track > :first-child {
        order: clamp(0, var(--current) - (sibling-count() - 3), 1);
      }

      .carousel-track > :last-child {
        order: calc(-1 * clamp(0, 2 - var(--current), 1));
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .carousel-track {
        scroll-behavior: smooth;
      }

      @supports (animation-timeline: view()) {
        .carousel-track > * {
          animation: fade-in linear both;
          /* Tracks the block axis, unlike the horizontal demo's view(inline) */
          animation-timeline: view(block);
          animation-range: entry 0% cover 40%;
        }

        @keyframes fade-in {
          from {
            opacity: 0.3;
          }

          to {
            opacity: 1;
          }
        }
      }
    }

    .carousel-controls {
      position: absolute;
      z-index: 1;
      inset-block: 0.5rem;
      inset-inline-start: calc(min(16rem, 100vw - 8rem) / 2);
      translate: -50% 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      pointer-events: none;
    }

    .carousel-controls button {
      pointer-events: auto;
      font: inherit;
      inline-size: 2.5rem;
      block-size: 2.5rem;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      rotate: 90deg;
      cursor: pointer;
    }

    .carousel-controls button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .carousel-markers {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
    }

    .carousel-markers button {
      inline-size: 0.8rem;
      block-size: 0.8rem;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: var(--line);
      cursor: pointer;
    }

    .carousel-markers button[aria-current="true"] {
      background: var(--accent);
    }

    .carousel-track,
    :where(.carousel-controls, .carousel-markers) button {
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 0.2rem solid #f90;
      outline-offset: 0.15rem;
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <section class="carousel" aria-roledescription="carousel" aria-label="Featured products">
    <div class="carousel-controls">
      <button type="button" class="carousel-prev" data-direction="previous" aria-label="Previous slide">‹</button>
      <button type="button" class="carousel-next" data-direction="next" aria-label="Next slide">›</button>
    </div>

    <div class="carousel-track" tabindex="0" role="group" aria-label="Slides">
      <div role="group" aria-roledescription="slide" aria-label="1 of 4" data-marker-name="Go to slide 1">Slide 1</div>
      <div role="group" aria-roledescription="slide" aria-label="2 of 4" data-marker-name="Go to slide 2">Slide 2</div>
      <div role="group" aria-roledescription="slide" aria-label="3 of 4" data-marker-name="Go to slide 3">Slide 3</div>
      <div role="group" aria-roledescription="slide" aria-label="4 of 4" data-marker-name="Go to slide 4">Slide 4</div>
    </div>

    <!-- MANDATORY: announces the current slide regardless of which control moved the carousel -->
    <p class="visually-hidden" role="status" aria-live="polite"></p>

    <nav class="carousel-markers" aria-label="Choose a slide"></nav>
  </section>

  <script type="module">
    const track = document.querySelector(".carousel-track");
    const slides = [...track.children];
    const status = document.querySelector('.carousel [role="status"]');
    const controls = document.querySelector(".carousel-controls");
    const markerNav = document.querySelector(".carousel-markers");
    const [prevBtn, nextBtn] = controls.querySelectorAll("button");
    let markers = [];
    const loops = CSS.supports("order: mod(sibling-index(), 2)");
    let parkedFor = -1;

    // Slides in visual order. `order` is 0 for every slide without looping support, so DOM order applies.
    const visual = () => [...slides].sort((a, b) => getComputedStyle(a).order - getComputedStyle(b).order);
    const neighbor = (item, step) => visual()[visual().indexOf(item) + step];

    // Block (y) axis only: distance from the track's center to the slide's center.
    const offsetToCenter = (s) => {
      const r = s.getBoundingClientRect();
      const t = track.getBoundingClientRect();
      return r.top + r.height / 2 - (t.top + t.height / 2);
    };

    // Scrolls the track to the slide's snap position without touching ancestor scrollers.
    const show = (item, behavior = "auto") => {
      if (item) track.scrollBy({ top: offsetToCenter(item), behavior });
    };

    const nearest = () => slides.reduce((a, b) => (Math.abs(offsetToCenter(b)) < Math.abs(offsetToCenter(a)) ? b : a));

    // Run a callback once scrolling settles. Without scrollend, a debounce stands in for it.
    function onSettled(fn) {
      if ("onscrollend" in window) {
        // A scrollend from a scroll that was cut short can arrive after the next one has started; skip it.
        track.addEventListener("scrollend", () => {
          const at = [track.scrollLeft, track.scrollTop].join();
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if ([track.scrollLeft, track.scrollTop].join() === at) fn();
          }));
        });
        return;
      }
      let timer;
      track.addEventListener("scroll", () => {
        clearTimeout(timer);
        timer = setTimeout(fn, 150);
      }, { passive: true });
    }

    // Clicks made mid-scroll build on the pending target, so rapid clicks are not lost.
    let pending = null;
    // Highlight the active marker right away rather than after scrolling settles.
    let marked = null;
    const mark = (item) => {
      // Writing the same attributes every frame makes Safari stutter, so only write on change
      if (item === marked) return;
      marked = item;
      const i = slides.indexOf(item);
      markers.forEach((m, j) => m.setAttribute("aria-current", String(j === i)));
    };
    const aim = (item) => {
      pending = item;
      mark(item);
      show(item);
    };
    const step = (dir) => {
      const target = neighbor(pending ?? nearest(), dir);
      if (target) aim(target);
    };
    let markFrame = 0;
    track.addEventListener("scroll", () => {
      // A click or key press already marked its target; recomputing every frame makes Safari stutter
      if (pending) return;
      cancelAnimationFrame(markFrame);
      markFrame = requestAnimationFrame(() => mark(pending ?? nearest()));
    }, { passive: true });

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));
    markers = slides.map((slide, i) => {
      const button = Object.assign(document.createElement("button"), { type: "button" });
      button.setAttribute("aria-label", slide.dataset.markerName || `Go to slide ${i + 1}`);
      button.addEventListener("click", () => aim(slide));
      markerNav.append(button);
      return button;
    });

    // Park an end slide beside the current one, then cancel the layout shift with an instant scroll.
    function park(item) {
      const before = offsetToCenter(item);
      // Snapping off while the slides are reordered: Firefox otherwise re-snaps to another slide and loops
      track.style.scrollSnapType = "none";
      // Safari paints the reordered layout for a frame before the compensating scroll lands; locking overflow hides that flicker
      if (document.activeElement !== track) track.style.overflowY = "hidden";
      track.style.setProperty("--current", slides.indexOf(item));
      track.scrollBy({ top: offsetToCenter(item) - before, behavior: "instant" });
      track.style.scrollSnapType = "";
      requestAnimationFrame(() => requestAnimationFrame(() => { track.style.overflowY = ""; }));
      // The parked slide is a visual-only neighbor, so keep it out of keyboard and AT reach.
      slides.forEach((s) => { s.inert = getComputedStyle(s).order !== "0"; });
      // Safari keeps the scroll-driven fade at its old progress after the instant scroll; restart it
      slides.forEach((s) => s.getAnimations().forEach((a) => { a.cancel(); a.play(); }));
    }

    // The single code path for state: controls only scroll; this reflects where scrolling ended.
    let settled = null;
    function sync() {
      pending = null;
      const item = nearest();
      const i = slides.indexOf(item);
      if (loops && i !== parkedFor) {
        parkedFor = i;
        park(item);
      }
      if (settled && item !== settled) {
        status.textContent = `Slide ${i + 1} of ${slides.length}`;
      }
      settled = item;
      mark(item);
      prevBtn.disabled = !neighbor(item, -1);
      nextBtn.disabled = !neighbor(item, 1);
    }

    onSettled(sync);
    sync();
  </script>
</body>

</html>
