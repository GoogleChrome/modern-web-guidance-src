<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carousel</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: Canvas;
      --ink: CanvasText;
      --line: color-mix(in srgb, CanvasText, transparent 75%);
      --inactive-button: #666666;
      --accent: #0a5;
      --minimum-target-size: 24px;
      --marker-button-diameter: 0.8rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      font: 1rem/1.5 system-ui, sans-serif;
      background: var(--surface);
      color: var(--ink);
    }

    .carousel {
      position: relative;
      inline-size: min(90vw, 32rem);
    }

    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      gap: 1rem;
      border-radius: 0.5rem;
    }

    .carousel-track > * {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: grid;
      place-items: center;
      block-size: 12rem;
      border-radius: 0.5rem;
      font-size: 2rem;
      background: color-mix(in srgb, var(--accent), var(--surface) 80%);
      border: 1px solid var(--line);
    }

    /*
     * Looping without clones: the script keeps --start, the slot (slide-sized step along the track) of the
     * first slide in the rotation. Every slide takes its place after it with `order`, and the first one
     * carries the empty slots before it as a margin. Moving the slide furthest behind to the front grows
     * that margin by one slot in the same change, so nothing on screen shifts and the scroll position
     * never needs correcting.
     * --start is deliberately not defined here: without JavaScript, DOM order applies.
     * Without support the carousel stays a finite list.
     */
    @supports (order: mod(sibling-index(), 2)) {
      .carousel-track {
        --gap: 1rem;

        > * {
          /* Kept non-negative inside mod(): both engines return the divisor instead of 0 for negative multiples */
          --place: mod(sibling-index() - 1 + sibling-count() - mod(var(--start), sibling-count()), sibling-count());
          order: var(--place);
          margin-inline-start: calc((1 - min(1, var(--place))) * var(--start) * (100% + var(--gap)));
          /* The last slide in the rotation carries a lap of empty slots after it, so a scripted scroll has room to aim past the slides */
          margin-inline-end: calc(max(0, var(--place) - (sibling-count() - 2)) * sibling-count() * (100% + var(--gap)));
        }
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .carousel-track {
        scroll-behavior: smooth;
      }

      @supports (animation-timeline: view()) {
        .carousel-track > * {
          animation: fade-in linear both;
          animation-timeline: view(inline);
          animation-range: entry 0% cover 40%;
        }

        @keyframes fade-in {
          from {
            opacity: 0.3;
          }

          to {
            opacity: 1;
          }
        }
      }
    }

    /* Overlay the buttons at the track's left and right edges, centered on the slide height */
    .carousel-controls {
      position: absolute;
      inset-inline: 0.5rem;
      inset-block-start: 0;
      block-size: 12rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 1;
    }

    .carousel-controls button {
      pointer-events: auto;
      font: inherit;
      inline-size: 2.5rem;
      block-size: 2.5rem;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .carousel-controls button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .carousel-markers {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-block-start: 0.75rem;
    }

    /* We hide styling on the button, just using it to ensure that it meets minimum target size for WCAG 2.5.8 Target Size */
    .carousel-markers button {
      background: none;
      border: none;
      cursor: pointer;
      min-inline-size: var(--minimum-target-size);
      min-block-size: var(--minimum-target-size);
      position: relative;
      outline: none;
    }

    /* Apply visible styling to the after pseudo element, positioned inside the appropriately sized button */
    .carousel-markers button::after {
      background: var(--inactive-button);
      block-size: var(--marker-button-diameter);
      border-radius: 50%;
      border: 0.1rem solid transparent;
      content: " ";
      inline-size: var(--marker-button-diameter);
      left: calc(var(--minimum-target-size) / 2 - var(--marker-button-diameter) / 2);
      padding: 0;
      position: absolute;
      top: calc(var(--minimum-target-size) / 2 - var(--marker-button-diameter) / 2);
    }

    /* Make the pseudo element also visibly display when it's focused */
    .carousel-markers button:focus-visible::after {
      outline: 0.2rem solid #f90;
      outline-offset: 0.15rem;
    }

    .carousel-markers button[aria-current="true"]::after {
      background: var(--accent);
      box-shadow: 0 0 0 0.1em #000, 0 0 0 0.2em #fff;
    }

    .carousel-track,
    :where(.carousel-controls, .carousel-markers) button {
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 0.2rem solid #f90;
      outline-offset: 0.15rem;
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <section class="carousel" aria-roledescription="carousel" aria-label="Featured products">
    <div class="carousel-controls">
      <button type="button" class="carousel-prev" data-direction="previous" aria-label="Previous slide">‹</button>
      <button type="button" class="carousel-next" data-direction="next" aria-label="Next slide">›</button>
    </div>

    <div class="carousel-track" tabindex="0" role="group" aria-label="Slides">
      <div role="group" aria-roledescription="slide" aria-label="1 of 4"
        data-marker-name="Go to slide 1">Slide 1</div>
      <div role="group" aria-roledescription="slide" aria-label="2 of 4"
        data-marker-name="Go to slide 2">Slide 2</div>
      <div role="group" aria-roledescription="slide" aria-label="3 of 4"
        data-marker-name="Go to slide 3">Slide 3</div>
      <div role="group" aria-roledescription="slide" aria-label="4 of 4"
        data-marker-name="Go to slide 4">Slide 4</div>
    </div>

    <!-- MANDATORY: announces the current slide regardless of which control moved the carousel -->
    <p class="visually-hidden" role="status" aria-live="polite"></p>

    <nav class="carousel-markers" aria-label="Choose a slide"></nav>
  </section>

  <script type="module">
    const track = document.querySelector(".carousel-track");
    const slides = [...track.children];
    const count = slides.length;
    const status = document.querySelector('.carousel [role="status"]');
    const controls = document.querySelector(".carousel-controls");
    const markerNav = document.querySelector(".carousel-markers");
    const [prevBtn, nextBtn] = controls.querySelectorAll("button");
    const loops = CSS.supports("order: mod(sibling-index(), 2)");

    // A slot is one slide plus the gap. Slots are numbered from the start of the track; slot s holds slide s mod count.
    const slot = () => slides[0].offsetWidth + parseFloat(getComputedStyle(track).columnGap);
    const here = () => Math.round(track.scrollLeft / slot());
    const slideAt = (s) => slides[((s % count) + count) % count];
    // Start well into the track so there is room to scroll backward
    const home = loops ? count * 100 : 0;

    // Keep the slides around the scroll position: one behind the direction of travel, the rest ahead.
    // Only slides that are off screen change slots, and the margin before the first one changes with them, so nothing visible moves.
    let start = null;
    let direction = 1;
    function rotate() {
      const first = Math.max(0, here() - (direction > 0 ? 1 : count - 2));
      if (first === start) return;
      start = first;
      track.style.setProperty("--start", start);
    }

    // Run a callback once scrolling settles. Without scrollend, a debounce stands in for it.
    function onSettled(fn) {
      if ("onscrollend" in window) {
        // A scrollend from a scroll that was cut short can arrive after the next one has started; skip it.
        track.addEventListener("scrollend", () => {
          const at = track.scrollLeft;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (track.scrollLeft === at) fn();
          }));
        });
        return;
      }
      let timer;
      track.addEventListener("scroll", () => {
        clearTimeout(timer);
        timer = setTimeout(fn, 150);
      }, { passive: true });
    }

    // Highlight the active marker right away rather than after scrolling settles.
    let markers = [];
    let marked = null;
    const mark = (item) => {
      // Writing the same attributes every frame makes Safari stutter, so only write on change
      if (item === marked) return;
      marked = item;
      const i = slides.indexOf(item);
      markers.forEach((m, j) => m.setAttribute("aria-current", String(j === i)));
    };

    // The slot being scrolled to. Clicks made mid-scroll build on it, so rapid clicks are not lost.
    let goal = null;
    const aim = (s) => {
      goal = loops ? s : Math.min(Math.max(s, 0), count - 1);
      mark(slideAt(goal));
      // Scripted scrolls land exactly on a slot. Snapping is off until they settle: the slide for a far slot is not there yet to snap to.
      track.style.scrollSnapType = "none";
      track.scrollTo({ left: goal * slot() });
    };

    let last = 0;
    let markFrame = 0;
    track.addEventListener("scroll", () => {
      if (track.scrollLeft !== last) direction = Math.sign(track.scrollLeft - last);
      last = track.scrollLeft;
      if (loops) rotate();
      // A click already marked its target; recomputing every frame makes Safari stutter
      if (goal !== null) return;
      cancelAnimationFrame(markFrame);
      markFrame = requestAnimationFrame(() => mark(slideAt(here())));
    }, { passive: true });

    prevBtn.addEventListener("click", () => aim((goal ?? here()) - 1));
    nextBtn.addEventListener("click", () => aim((goal ?? here()) + 1));
    markers = slides.map((slide, i) => {
      const button = Object.assign(document.createElement("button"), { type: "button" });
      button.setAttribute("aria-label", slide.dataset.markerName || `Go to slide ${i + 1}`);
      // Markers travel in sequence order: by the difference in slide number
      button.addEventListener("click", () => {
        const from = goal ?? here();
        aim(from + i - slides.indexOf(slideAt(from)));
      });
      markerNav.append(button);
      return button;
    });

    // The single code path for state: controls only scroll; this reflects where scrolling ended.
    let settled = null;
    function sync() {
      goal = null;
      track.style.scrollSnapType = "";
      const item = slideAt(here());
      const i = slides.indexOf(item);
      if (settled && item !== settled) {
        status.textContent = `Slide ${i + 1} of ${count}`;
      }
      settled = item;
      mark(item);
      const focused = document.activeElement;
      prevBtn.disabled = !loops && i === 0;
      nextBtn.disabled = !loops && i === count - 1;
      // Disabling the focused button drops focus, so hand it to the opposite one. Never move focus the user had elsewhere.
      if (focused === prevBtn && prevBtn.disabled) {
        nextBtn.focus();
      } else if (focused === nextBtn && nextBtn.disabled) {
        prevBtn.focus();
      }
    }

    if (loops) {
      // Lay the slides out around home, then go there, in one task so the empty track before it is never painted
      start = home - 1;
      track.style.setProperty("--start", start);
      track.scrollTo({ left: home * slot(), behavior: "instant" });
      last = track.scrollLeft;
    }
    onSettled(sync);
    sync();
  </script>
</body>

</html>
