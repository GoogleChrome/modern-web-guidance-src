<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carousel</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: Canvas;
      --ink: CanvasText;
      --muted: color-mix(in oklab, CanvasText 55%, Canvas);
      --radius: 1.25rem;
      --slide-ratio: 16 / 9;
      --marker-size: 0.625rem;
      /* Thin invisible rim around each dot that still takes clicks and taps */
      --marker-hit: 0.25rem;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      font: 1rem/1.5 system-ui, sans-serif;
      background: var(--surface);
      color: var(--ink);
    }

    .carousel {
      position: relative;
      inline-size: min(92vw, 38rem);
      container-type: inline-size;
    }

    .carousel-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      gap: 1rem;
      border-radius: var(--radius);
    }

    /* Each slide sets --hue; its artwork is gradients derived from it, standing in for a product photo */
    .carousel-track > * {
      flex: 0 0 100%;
      scroll-snap-align: center;
      position: relative;
      overflow: hidden;
      display: grid;
      align-content: end;
      gap: 0.25rem;
      aspect-ratio: var(--slide-ratio);
      padding-block: clamp(1.25rem, 5cqi, 2.25rem);
      /* Clear the previous and next buttons, which overlay the slide's edges */
      padding-inline: 4.5rem;
      border-radius: var(--radius);
      color: white;
      background:
        radial-gradient(60% 80% at 100% 0%, oklch(75% 0.16 calc(var(--hue) + 70)), transparent),
        linear-gradient(135deg, oklch(48% 0.19 var(--hue)), oklch(28% 0.12 calc(var(--hue) + 40)));

      /* Position badge, from the slide's label. The empty alternative text stops it being read out twice */
      &::before {
        content: attr(aria-label) / "";
        position: absolute;
        inset-block-start: 1rem;
        inset-inline-start: 1rem;
        padding: 0.15rem 0.6rem;
        border-radius: 100vmax;
        background: rgb(0 0 0 / 0.35);
        font-size: 0.75rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      /* A shaded sphere where the product would be */
      &::after {
        content: "";
        position: absolute;
        inset-inline-end: 4.5rem;
        inset-block-start: 50%;
        translate: 0 -50%;
        inline-size: 28%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%,
            oklch(96% 0.05 calc(var(--hue) + 70)),
            oklch(70% 0.19 calc(var(--hue) + 40)) 35%,
            oklch(30% 0.15 var(--hue)));
        box-shadow: 0 1.5rem 3rem -0.5rem oklch(15% 0.1 var(--hue) / 0.7);
      }

      & > * {
        margin: 0;
      }

      /* Narrow slides have no room for the sphere beside the text; wider ones keep the text clear of it */
      @container (inline-size < 30rem) {
        &::after {
          display: none;
        }
      }

      @container (inline-size >= 30rem) {
        & > * {
          max-inline-size: 60%;
        }
      }

      h2 {
        font-size: clamp(1.25rem, 5cqi, 2rem);
        line-height: 1.15;
        text-wrap: balance;
      }

      p {
        font-size: 0.95rem;
        line-height: 1.4;
        text-wrap: pretty;
      }

      .eyebrow {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    }

    /*
     * Looping without clones: at or one step from the first slide, park the last slide before it
     * (order: -1); at or one step from the last slide, park the first slide after it (order: 1). The
     * neighbor is already in place before scrolling reaches an end, so the previous and next buttons never
     * disable. Only the first and last slides ever get `order`.
     * The script sets --children-count only where sibling-count() is unsupported.
     */
    /* --current is deliberately not defined here: without JavaScript no slide is parked, so DOM order applies and the carousel starts on slide 1 */
    .carousel-track > :first-child {
      order: clamp(0, var(--current) - (var(--children-count, sibling-count()) - 3), 1);
    }

    .carousel-track > :last-child {
      order: calc(-1 * clamp(0, 2 - var(--current), 1));
    }

    @media (prefers-reduced-motion: no-preference) {
      .carousel-track {
        scroll-behavior: smooth;
      }

      @supports (animation-timeline: view()) {
        .carousel-track > * {
          animation: fade-in linear both;
          animation-timeline: view(inline);
          animation-range: entry 0% cover 40%;
        }

        @keyframes fade-in {
          from {
            opacity: 0.3;
          }

          to {
            opacity: 1;
          }
        }
      }
    }

    /* Overlay the buttons at the track's left and right edges. Same aspect ratio as the slides, so they center on the slide height */
    .carousel-controls {
      position: absolute;
      inset-inline: 0;
      inset-block-start: 0;
      aspect-ratio: var(--slide-ratio);
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 1;
    }

    /* Fixed colors: the buttons always sit on the slide artwork, not on the page surface */
    .carousel-controls button {
      pointer-events: auto;
      /* Margin, not padding on the overlay: WebKit shrinks an absolutely positioned box with aspect-ratio by its padding */
      margin-inline: 0.75rem;
      display: grid;
      place-items: center;
      inline-size: 2.75rem;
      block-size: 2.75rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgb(255 255 255 / 0.9);
      color: #111;
      box-shadow: 0 0.125rem 0.5rem rgb(0 0 0 / 0.25);
      cursor: pointer;

      &:hover {
        background: white;
      }

      &:active {
        scale: 0.94;
      }

      /* Two-tone ring, visible on any slide color */
      &:focus-visible {
        outline: 0.2rem solid black;
        outline-offset: 0;
        box-shadow: 0 0 0 0.4rem white;
      }

      &:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      svg {
        inline-size: 1.25rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    }

    .carousel-markers {
      display: flex;
      justify-content: center;
      /* With the rim, dot centers sit 26px apart, so 24px target circles do not overlap (WCAG 2.5.8 Target Size) */
      gap: 0.5rem;
      margin-block-start: 0.75rem;
    }

    /*
     * The transparent border is part of the button, so it makes the click and tap target
     * a little larger than the visible dot. background-clip keeps the fill off the border.
     */
    .carousel-markers button {
      box-sizing: content-box;
      inline-size: var(--marker-size);
      block-size: var(--marker-size);
      padding: 0;
      border: var(--marker-hit) solid transparent;
      border-radius: 100vmax;
      background: var(--muted) padding-box;
      cursor: pointer;

      &:hover {
        background-color: var(--ink);
      }

      /* Wider, not just a different color (WCAG 1.4.1 Use of Color) */
      &[aria-current="true"] {
        inline-size: calc(var(--marker-size) * 2.8);
        background-color: var(--ink);
      }

      /* Pull the outline in from the border edge so it hugs the dot */
      &:focus-visible {
        outline-offset: calc(0.15rem - var(--marker-hit));
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .carousel-controls button {
        transition: scale 0.15s, background-color 0.15s;
      }

      .carousel-markers button {
        transition: inline-size 0.25s, background-color 0.25s;
      }
    }

    .carousel-track,
    :where(.carousel-controls, .carousel-markers) button {
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 0.2rem solid var(--ink);
      outline-offset: 0.15rem;
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <section class="carousel" aria-roledescription="carousel" aria-label="Featured products">
    <div class="carousel-controls">
      <button type="button" class="carousel-prev" data-direction="previous" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
      </button>
      <button type="button" class="carousel-next" data-direction="next" aria-label="Next slide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </button>
    </div>

    <div class="carousel-track" tabindex="0" role="group" aria-label="Slides">
      <div role="group" aria-roledescription="slide" aria-label="1 of 4"
        data-marker-name="Go to slide 1" style="--hue: 290">
        <p class="eyebrow">New</p>
        <h2>Aurora desk lamp</h2>
        <p>Warm, dimmable light that follows your day.</p>
      </div>
      <div role="group" aria-roledescription="slide" aria-label="2 of 4"
        data-marker-name="Go to slide 2" style="--hue: 20">
        <p class="eyebrow">Bestseller</p>
        <h2>Ember travel mug</h2>
        <p>Keeps coffee hot from the first sip to the last.</p>
      </div>
      <div role="group" aria-roledescription="slide" aria-label="3 of 4"
        data-marker-name="Go to slide 3" style="--hue: 165">
        <p class="eyebrow">Back in stock</p>
        <h2>Moss planter</h2>
        <p>Self-watering, so your plants forgive you.</p>
      </div>
      <div role="group" aria-roledescription="slide" aria-label="4 of 4"
        data-marker-name="Go to slide 4" style="--hue: 235">
        <p class="eyebrow">Limited edition</p>
        <h2>Tide speaker</h2>
        <p>Room-filling sound in a pocket-sized shell.</p>
      </div>
    </div>

    <!-- MANDATORY: announces the current slide regardless of which control moved the carousel -->
    <p class="visually-hidden" role="status" aria-live="polite"></p>

    <nav class="carousel-markers" aria-label="Choose a slide"></nav>
  </section>

  <script type="module">
    const track = document.querySelector(".carousel-track");
    const slides = [...track.children];
    const status = document.querySelector('.carousel [role="status"]');
    const controls = document.querySelector(".carousel-controls");
    const markerNav = document.querySelector(".carousel-markers");
    const [prevBtn, nextBtn] = controls.querySelectorAll("button");
    let markers = [];
    // Where sibling-count() is unsupported, give CSS the number of slides instead
    if (!CSS.supports("order: sibling-count()")) track.style.setProperty("--children-count", slides.length);
    let parkedFor = -1;

    // Slides in visual order. `order` is 0 for every slide on a marker trip, so DOM order applies.
    const visual = () => [...slides].sort((a, b) => getComputedStyle(a).order - getComputedStyle(b).order);
    const neighbor = (item, step) => visual()[visual().indexOf(item) + step];

    // Inline (x) axis only: distance from the track's center to the slide's center.
    const offsetToCenter = (s) => {
      const r = s.getBoundingClientRect();
      const t = track.getBoundingClientRect();
      return r.left + r.width / 2 - (t.left + t.width / 2);
    };

    // Scrolls the track to the slide's snap position without touching ancestor scrollers.
    const show = (item, behavior = "auto") => {
      if (item) track.scrollBy({ left: offsetToCenter(item), behavior });
    };

    const nearest = () => slides.reduce((a, b) => (Math.abs(offsetToCenter(b)) < Math.abs(offsetToCenter(a)) ? b : a));

    const position = () => [track.scrollLeft, track.scrollTop].join();

    // Run a callback once scrolling settles. Without scrollend, a debounce stands in for it.
    function onSettled(fn) {
      if ("onscrollend" in window) {
        // A scrollend from a scroll that was cut short can arrive after the next one has started; skip it.
        track.addEventListener("scrollend", () => {
          const at = position();
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (position() === at) fn();
          }));
        });
        return;
      }
      let timer;
      track.addEventListener("scroll", () => {
        clearTimeout(timer);
        timer = setTimeout(fn, 150);
      }, { passive: true });
    }

    // Clicks made mid-scroll build on the pending target, so rapid clicks are not lost.
    let pending = null;
    let aimedAt = null;
    // Highlight the active marker right away rather than after scrolling settles.
    let marked = null;
    const mark = (item) => {
      // Writing the same attributes every frame makes Safari stutter, so only write on change
      if (item === marked) return;
      marked = item;
      const i = slides.indexOf(item);
      markers.forEach((m, j) => m.setAttribute("aria-current", String(j === i)));
    };
    const aim = (item) => {
      pending = item;
      mark(item);
      show(item);
      aimedAt = position();
    };
    // A Previous/Next click that cannot be followed yet, replayed once scrolling settles
    let queued = 0;
    const step = (dir) => {
      const target = neighbor(pending ?? nearest(), dir);
      if (target) aim(target);
      // On a marker trip the slides are in DOM order, so an end slide has no neighbor to wrap to until settling parks again
      else if (parkedFor === "initial") queued = dir;
    };
    let markFrame = 0;
    track.addEventListener("scroll", () => {
      // A click or key press already marked its target; recomputing every frame makes Safari stutter
      if (pending) return;
      cancelAnimationFrame(markFrame);
      markFrame = requestAnimationFrame(() => mark(pending ?? nearest()));
    }, { passive: true });

    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));
    markers = slides.map((slide, i) => {
      const button = Object.assign(document.createElement("button"), { type: "button" });
      button.setAttribute("aria-label", slide.dataset.markerName || `Go to slide ${i + 1}`);
      button.addEventListener("click", () => {
        // A direct scroll to a parked end slide goes the short way round, so travel in DOM order; settling parks again
        if (slide !== nearest()) park();
        // A new marker target replaces a click that was waiting on the previous one
        queued = 0;
        aim(slide);
      });
      markerNav.append(button);
      return button;
    });

    // Tell CSS the settled slide (or none, for DOM order), then cancel the layout shift with an instant scroll.
    function park(current = "initial") {
      parkedFor = current;
      const item = nearest();
      const before = offsetToCenter(item);
      // Snapping off while the slides are reordered: Firefox otherwise re-snaps to another slide and loops
      track.style.scrollSnapType = "none";
      // Safari paints the reordered layout for a frame before the compensating scroll lands; locking overflow hides that flicker.
      // Not when a scroll is about to follow (a marker trip, or a queued click): Safari will not start it on a locked track.
      if (current !== "initial" && !queued && document.activeElement !== track) track.style.overflowX = "hidden";
      track.style.setProperty("--current", current);
      track.scrollBy({ left: offsetToCenter(item) - before, behavior: "instant" });
      track.style.scrollSnapType = "";
      requestAnimationFrame(() => requestAnimationFrame(() => { track.style.overflowX = ""; }));
      // Safari keeps the scroll-driven fade at its old progress after the instant scroll; restart it
      slides.forEach((s) => s.getAnimations().forEach((a) => { a.cancel(); a.play(); }));
    }

    // The single code path for state: controls only scroll; this reflects where scrolling ended.
    let settled = null;
    function sync() {
      // A settle right where a scroll to another slide was requested is not that scroll ending (it has yet to move), so wait for the real one
      if (pending && pending !== nearest() && position() === aimedAt) return;
      pending = null;
      const item = nearest();
      const i = slides.indexOf(item);
      if (i !== parkedFor) {
        park(i);
      }
      if (settled && item !== settled) {
        status.textContent = `Slide ${i + 1} of ${slides.length}`;
      }
      settled = item;
      mark(item);
      const focused = document.activeElement;
      prevBtn.disabled = !neighbor(item, -1);
      nextBtn.disabled = !neighbor(item, 1);
      // Disabling the focused button drops focus, so hand it to the opposite one. Never move focus the user had elsewhere.
      if (focused === prevBtn && prevBtn.disabled) {
        nextBtn.focus();
      } else if (focused === nextBtn && nextBtn.disabled) {
        prevBtn.focus();
      }
      if (queued) {
        const dir = queued;
        queued = 0;
        step(dir);
      }
    }

    onSettled(sync);
    sync();
  </script>
</body>

</html>
