<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carousel</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: Canvas;
      --ink: CanvasText;
      --line: color-mix(in srgb, CanvasText, transparent 75%);
      --accent: #0a5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      font: 1rem/1.5 system-ui, sans-serif;
      background: var(--surface);
      color: var(--ink);
    }

    .carousel {
      position: relative;
      inline-size: min(90vw, 32rem);
    }

    .carousel-track {
      anchor-name: --carousel-track;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      gap: 1rem;
      border-radius: 0.5rem;
    }

    .carousel-item {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: grid;
      place-items: center;
      block-size: 12rem;
      border-radius: 0.5rem;
      font-size: 2rem;
      background: color-mix(in srgb, var(--accent), var(--surface) 80%);
      border: 1px solid var(--line);
    }

    @media (prefers-reduced-motion: no-preference) {
      .carousel-track {
        scroll-behavior: smooth;
      }

      @supports (animation-timeline: view()) {
        .carousel-item {
          animation: fade-in linear both;
          animation-timeline: view(inline);
          animation-range: entry 0% cover 40%;
        }

        @keyframes fade-in {
          from {
            opacity: 0.3;
          }

          to {
            opacity: 1;
          }
        }
      }
    }

    @supports selector(::scroll-button(*)) and (anchor-name: --carousel-track) {
      .carousel-track::scroll-button(inline-start) {
        content: "‹" / "Previous slide";
        inset-inline-start: calc(anchor(start) + 0.5rem);
      }

      .carousel-track::scroll-button(inline-end) {
        content: "›" / "Next slide";
        inset-inline-end: calc(anchor(end) + 0.5rem);
      }

      .carousel-track::scroll-button(*) {
        /* Pull the buttons out of the flex flow and center them on the track */
        position: absolute;
        position-anchor: --carousel-track;
        inset-block-start: anchor(center);
        translate: 0 -50%;
        font-size: 1.5rem;
        line-height: 1;
        inline-size: 2.5rem;
        block-size: 2.5rem;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }

      .carousel-track::scroll-button(*):disabled {
        opacity: 0.3;
        pointer-events: none;
      }
    }

    @supports selector(::scroll-marker) {
      .carousel-track {
        scroll-marker-group: after;
      }

      ::scroll-marker-group {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        /* matches the dot height */
        height: 0.8rem;
        margin-block: 0.8rem;
      }

      .carousel-item::scroll-marker {
        content: "" / attr(data-marker-name);
        inline-size: 0.8rem;
        block-size: 0.8rem;
        border-radius: 50%;
        background: var(--line);
        border: none;
        cursor: pointer;
      }

      .carousel-item::scroll-marker:target-current {
        background: var(--accent);
      }
    }

    .carousel-item[data-clone]::scroll-marker {
      content: none;
    }

    /* Overlay the buttons at the track's left and right edges, centered on the slide height */
    .fallback-controls {
      position: absolute;
      inset-inline: 0.5rem;
      inset-block-start: 0;
      block-size: 12rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 1;
    }

    .fallback-controls button {
      pointer-events: auto;
      font: inherit;
      inline-size: 2.5rem;
      block-size: 2.5rem;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .fallback-controls button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .fallback-markers {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-block-start: 0.75rem;
    }

    /* display on the classes above would otherwise override the hidden attribute */
    .fallback-controls[hidden],
    .fallback-markers[hidden] {
      display: none;
    }

    .fallback-markers button {
      inline-size: 0.8rem;
      block-size: 0.8rem;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: var(--line);
      cursor: pointer;
    }

    .fallback-markers button[aria-current="true"] {
      background: var(--accent);
    }

    :focus-visible {
      outline: 0.2rem solid #f90;
      outline-offset: 0.15rem;
    }

    .visually-hidden {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <section class="carousel" aria-roledescription="carousel" aria-label="Featured products">
    <!-- Rendered only when the browser lacks native ::scroll-button() support -->
    <div class="fallback-controls" hidden>
      <button type="button" class="carousel-prev" data-direction="previous" aria-label="Previous slide">‹</button>
      <button type="button" class="carousel-next" data-direction="next" aria-label="Next slide">›</button>
    </div>

    <div class="carousel-track" tabindex="0" role="group" aria-label="Slides">
      <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="1 of 4"
        data-marker-name="Go to slide 1">Slide 1</div>
      <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 of 4"
        data-marker-name="Go to slide 2">Slide 2</div>
      <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 of 4"
        data-marker-name="Go to slide 3">Slide 3</div>
      <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="4 of 4"
        data-marker-name="Go to slide 4">Slide 4</div>
    </div>

    <!-- MANDATORY: announces the current slide regardless of which control moved the carousel -->
    <p class="visually-hidden" role="status" aria-live="polite"></p>

    <!-- Rendered only when the browser lacks native ::scroll-marker support -->
    <nav class="fallback-markers" aria-label="Slides" hidden></nav>
  </section>

  <script type="module">
    const track = document.querySelector(".carousel-track");
    const slides = [...track.querySelectorAll(".carousel-item")];
    const status = document.querySelector('.carousel [role="status"]');
    const controls = document.querySelector(".fallback-controls");
    const markerNav = document.querySelector(".fallback-markers");
    const [prevBtn, nextBtn] = controls.querySelectorAll("button");
    const hasButtons = CSS.supports("selector(::scroll-button(*))") &&
      CSS.supports("anchor-name: --carousel-track");
    const hasMarkers = CSS.supports("selector(::scroll-marker)");
    let markers = [];

    const show = (item, behavior = "auto") =>
      item?.scrollIntoView({ behavior, inline: "center", block: "nearest" });

    // Inline (x) axis only.
    function nearest() {
      const center = track.getBoundingClientRect().left + track.clientWidth / 2;
      const distance = (s) => {
        const r = s.getBoundingClientRect();
        return Math.abs(r.left + r.width / 2 - center);
      };
      return [...track.children].reduce((a, b) => (distance(b) < distance(a) ? b : a));
    }

    // Run a callback once scrolling settles, with a debounced fallback when scrollend is unsupported.
    function onSettled(fn) {
      let timer;
      track.addEventListener("scrollend", fn);
      track.addEventListener("scroll", () => {
        clearTimeout(timer);
        timer = setTimeout(fn, 150);
      }, { passive: true });
    }

    controls.hidden = hasButtons;
    if (!hasButtons) {
      prevBtn.addEventListener("click", () => show(nearest().previousElementSibling));
      nextBtn.addEventListener("click", () => show(nearest().nextElementSibling));
    }
    markerNav.hidden = hasMarkers;
    if (!hasMarkers) {
      markers = slides.map((slide, i) => {
        const button = Object.assign(document.createElement("button"), { type: "button", textContent: i + 1 });
        button.setAttribute("aria-label", slide.dataset.markerName || `Go to slide ${i + 1}`);
        button.addEventListener("click", () => show(slide));
        markerNav.append(button);
        return button;
      });
    }

    function sync() {
      const item = nearest();
      if (item.dataset.clone) return; // looping clones are resolved by the looping script
      const i = slides.indexOf(item);
      status.textContent = `Slide ${i + 1} of ${slides.length}`;
      markers.forEach((m, j) => m.setAttribute("aria-current", String(j === i)));
      prevBtn.disabled = !item.previousElementSibling;
      nextBtn.disabled = !item.nextElementSibling;
    }

    onSettled(sync);
    sync();

    // Two inert, hidden clones on each side keep the track away from its scroll limits, so
    // native scroll buttons never disable and keyboard focus stays on them.
    const offset = 2;
    const clone = (slide) => {
      const copy = Object.assign(slide.cloneNode(true), { inert: true });
      copy.dataset.clone = copy.ariaHidden = "true";
      return copy;
    };
    track.prepend(...slides.slice(-offset).map(clone));
    track.append(...slides.slice(0, offset).map(clone));

    const items = [...track.children];

    // Reposition without scrollIntoView(), which would move the sequential focus starting point
    // into an inert clone and make Tab skip the carousel controls.
    const jump = (item) => {
      const t = track.getBoundingClientRect();
      const r = item.getBoundingClientRect();
      track.scrollBy({ left: r.left + r.width / 2 - (t.left + track.clientWidth / 2), behavior: "instant" });
    };
    jump(items[offset]);

    // Landed on a clone: jump invisibly to the identical real slide, `slides.length` positions away.
    onSettled(() => {
      const item = nearest();
      const k = items.indexOf(item);
      if (item.dataset.clone) jump(items[k < offset ? k + slides.length : k - slides.length]);
    });
    sync();
  </script>
</body>

</html>
