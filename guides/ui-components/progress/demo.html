<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar Demo</title>
    <style>
        :root {
            /* Automatic theme adaptation */
            color-scheme: light dark;
            --color-dark-accent: oklch(52.451% 0.159 325);
            --accent-color: var(--color-dark-accent, AccentColor); 
            /* Fixed: Light-dark colors should be light in light mode and dark in dark mode for track/surface */
            --color-surface: light-dark(oklch(95.6% 0.027 340), oklch(30% 0.027 340));
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
            background-color: canvas;
            color: canvastext;
        }

        section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            border: 1px solid light-dark(oklch(90% 0 0), oklch(40% 0 0));
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        /* Basic progress styling used in Determinate/Indeterminate examples */
        .basic-progress {
            accent-color: var(--accent-color);
            display: block;
            inline-size: 100%;
            max-inline-size: 400px;
            margin-block: 0.5rem;
        }

        /* Advanced styling from the guide */
        .advanced-progress {
            appearance: none;
            block-size: 0.5lh;
            inline-size: 100%;
            max-inline-size: 400px;
            margin-block: 0.5rem;
            display: block;
            border-radius: 1e5px;
            overflow: hidden;

            /* Apply color for custom progress track (background) */
            background: var(--color-surface);

            /* Use browser target pseudo selector to make the default progress background transparent */
            &::-webkit-progress-bar {
                background: transparent;
            }

            /* Apply color for custom progress bar */
            &::-webkit-progress-value {
                background: var(--progress-color, var(--accent-color));
            }
            &::-moz-progress-bar {
                background: var(--progress-color, var(--accent-color));
            }

            /* Indeterminate state animation */
            --indeterminate-track: linear-gradient(to right, 
                transparent 0% 15%, 
                var(--accent-color, currentColor) 15% 45%, 
                transparent 45% 100%
            );
            --indeterminate-track-size: 200% 100%;
            --indeterminate-track-animation: loading 1.5s infinite linear;

            &:indeterminate::-webkit-progress-bar {
                background: var(--indeterminate-track);
                background-size: var(--indeterminate-track-size);
                animation: var(--indeterminate-track-animation);
            }

            /* **Mandatory**: -moz- and -webkit- pseudo selectors cannot be grouped. If grouped one of the selectors will be ignored.  */
            &:indeterminate::-moz-progress-bar {
                background: var(--indeterminate-track);
                background-size: var(--indeterminate-track-size);
                animation: var(--indeterminate-track-animation);
            }

            &:focus-visible {
                outline: 1px solid canvasText;
                outline-offset: 4px;
            }
        }

        @keyframes loading {
            from { background-position: 200% 0; }
            to { background-position: -150% 0; }
        }

        /* Respect prefers-reduced-motion */
        @media (prefers-reduced-motion: reduce) {
            .advanced-progress:indeterminate::-webkit-progress-bar {
                /* Slow down the animation significantly */
                animation-duration: 10s;
            }

            .advanced-progress:indeterminate::-moz-progress-bar {
                /* Slow down the animation significantly */
                animation-duration: 10s;
            }
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 1rem;
        }

        button {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Native Progress Bars</h1>

    <section>
        <h2>Determinate State</h2>
        <label for="det-progress">File progress:</label>
        <progress id="det-progress" class="basic-progress" value="20" max="100"></progress>
        
        <div class="controls">
            <button id="update-btn">Add 10%</button>
        </div>
    </section>

    <section>
        <h2>Indeterminate State</h2>
        <label for="indet-progress">Downloading...</label>
        <!-- Omit value attribute for indeterminate state -->
        <progress id="indet-progress" class="basic-progress" max="100"></progress>
    </section>

    <section>
        <h2>Advanced Styling & Accessibility</h2>
        
        <!-- The progress bar is physically separate from the region it describes -->
        <label for="upload-progress">Upload Progress:</label>
        <progress id="upload-progress" class="advanced-progress" tabindex="-1"></progress>
        
        <!-- The region being updated references the progress bar using aria-describedby -->
        <div id="loading-region" aria-busy="false" aria-describedby="upload-progress">
            <p id="status-text">Ready to upload...</p>
            <div class="controls">
                <button id="start-btn">Simulate Upload</button>
            </div>
        </div>
    </section>

    <script>
        // Determinate example logic
        const detBar = document.getElementById('det-progress');
        const updateBtn = document.getElementById('update-btn');

        updateBtn.addEventListener('click', () => {
            if (detBar.value < detBar.max) {
                detBar.value += 10;
            } else {
                detBar.value = 0;
            }
        });

        // Advanced example logic
        const region = document.getElementById('loading-region');
        const advBar = document.getElementById('upload-progress');
        const status = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');

        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            simulateTask();
        });

        function simulateTask() {
            region.setAttribute('aria-busy', 'true');
            status.textContent = "Uploading...";
            advBar.removeAttribute('value'); // Set to indeterminate

            setTimeout(() => {
                advBar.max = 100;
                advBar.value = 0;
                advBar.focus(); // Force screen reader announcement

                const interval = setInterval(() => {
                    advBar.value += 10;

                    if (advBar.value >= 100) {
                        clearInterval(interval);
                        status.textContent = "Task Complete!";
                        region.setAttribute('aria-busy', 'false');
                        advBar.focus();
                        startBtn.disabled = false;
                    } else {
                        status.textContent = `Progress: ${advBar.value}%`;
                    }
                }, 400);
            }, 2000);
        }
    </script>
</body>
</html>
