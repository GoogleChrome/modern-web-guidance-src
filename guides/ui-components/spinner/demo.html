<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinner Demo</title>
    <style>
      @layer util {
        .visually-hidden:where(:not(:focus-within, :active)) {
          position: absolute !important;
          clip-path: inset(50%) !important;
          overflow: hidden !important;
          width: 1px !important;
          height: 1px !important;
          margin: -1px !important;
          padding: 0 !important;
          border: 0 !important;
          white-space: nowrap !important;
        }
      }
      @layer demo {
        body {
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
          display: grid;
          place-items: center;
          min-height: 100vh;
          margin: 0;
          background: #f8fafc;
          color: #1e293b;
        }

        .container {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2.5rem;
          padding: 3rem;
          background: white;
          border-radius: 1.5rem;
          box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
          width: 100%;
          max-width: 400px;
        }

        .examples {
          display: flex;
          gap: 2rem;
          align-items: center;
        }

        .label {
          font-size: 0.875rem;
          font-weight: 500;
          color: #64748b;
          margin-bottom: 0.5rem;
          text-align: center;
        }

        button {
          padding: 0.5rem 1rem;
          border-radius: 0.5rem;
          border: 1px solid #e2e8f0;
          background: white;
          cursor: pointer;
          font-weight: 500;
          transition: all 0.2s;
        }

        button:hover {
          background: #f1f5f9;
          border-color: #cbd5e1;
        }

        button:active {
          background: #e2e8f0;
        }
      }

      @layer component {
        .loading-spinner {
          --size: 40px;
          --thickness: 4px;
          --spinner-color: #3b82f6;

          position: relative;
          width: var(--size);
          height: var(--size);
          border-radius: 50%;

          background: conic-gradient(
            from 0deg,
            transparent 25%,
            var(--spinner-color)
          );

          mask-image: radial-gradient(
            transparent calc(50% - var(--thickness)),
            black calc(50% - var(--thickness) + 0.5px)
          );

          animation: spinner-rotate 0.8s linear infinite;
        }

        .loading-spinner--large {
          --size: 64px;
          --thickness: 6px;
        }

        .loading-spinner--custom {
          --spinner-color: #f43f5e;
        }

        @keyframes spinner-rotate {
          to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
          .loading-spinner {
            animation-duration: 3s;
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="examples">
        <div id="default-container">
          <div class="label">Default</div>
          <div class="loading-spinner" role="status">
            <progress aria-label="Loading" class="visually-hidden"></progress>
          </div>
        </div>

        <div id="large-container">
          <div class="label">Large</div>
          <div class="loading-spinner loading-spinner--large" role="status">
            <progress aria-label="Loading" class="visually-hidden"></progress>
          </div>
        </div>

        <div id="custom-container">
          <div class="label">Custom</div>
          <div class="loading-spinner loading-spinner--custom" role="status">
            <progress aria-label="Loading" class="visually-hidden"></progress>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
