<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light dark">
<title>Accordion</title>
<style>
	:root {
		font-family: system-ui;
	}

	details {
		--accordion-border-radius: 0.5rem;
		--accordion-margin-block: 1rem;
		--accordion-item-trigger-padding-block: 0.5rem;
		--accordion-item-content-padding: 1rem;
		border: 2px solid light-dark(Black, White);
	}

	details:first-of-type {
		margin-block-start: var(--accordion-margin-block);
		border-start-start-radius: var(--accordion-border-radius);
		border-start-end-radius: var(--accordion-border-radius);
	}

	details:last-of-type {
		margin-block-end: var(--accordion-margin-block);
		border-end-start-radius: var(--accordion-border-radius);
		border-end-end-radius: var(--accordion-border-radius);
	}

	details + details {
		border-block-start-width: 0;
	}

	summary {
		border-radius: inherit;
		padding-inline-start: var(--accordion-item-content-padding);
		padding-block: var(--accordion-item-trigger-padding-block);
	}

	details::details-content {
		padding-inline: var(--accordion-item-content-padding);
	}

	@supports (interpolate-size: allow-keywords) {
		details::details-content {
			interpolate-size: allow-keywords;
			overflow: clip;
			contain: layout;
			transition:
				block-size 0.3s ease-in-out,
				content-visibility 0.3s ease-in-out;
			transition-behavior: allow-discrete;
		}

		details:not(:open, [open])::details-content {
			block-size: 0;
		}
	}
</style>

<h1>Accordion</h1>

<section>
	<h2>Accordion using details</h2>
	<div id="resources-accordion" role="region" aria-labelledby="resources">
		<h3 id="resources">Resources</h3>
		<button type="button" commandfor="resources-accordion" command="--expand-all">Expand all</button>
		<button type="button" commandfor="resources-accordion" command="--collapse-all">Collapse all</button>
		<details open>
			<summary>Articles</summary>
			<p>Articles contents</p>
		</details>
		<details>
			<summary>Videos</summary>
			<p>Videos contents</p>
		</details>
	</div>
</section>

<section>
	<h2>Exclusive accordion using details</h2>
	<nav aria-labelledby="topics">
		<h3 id="topics">Topics</h3>
		<details name="topics">
			<summary>Development</summary>
			<p>Development contents</p>
		</details>
		<details name="topics">
			<summary>Design</summary>
			<p>Design contents</p>
		</details>
	</nav>
</section>

<script>
document.addEventListener("command", event => {
	if (event.command !== "--expand-all" && event.command !== "--collapse-all") return;
	const expanded = event.command === "--expand-all";

	for (const details of event.target.querySelectorAll("details")) details.open = expanded;
}, { capture: true });

document.addEventListener("click", event => {
	if (event.target.closest("[data-always-open] details[open] > summary")) event.preventDefault();
});

document.addEventListener("toggle", event => {
	if (!event.target.matches("[data-always-open] details")) return;
	event.target.querySelector(":scope > summary").setAttribute("aria-disabled", event.target.open);
}, { capture: true });
</script>
