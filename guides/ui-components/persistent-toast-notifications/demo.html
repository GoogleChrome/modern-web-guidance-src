<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent Toast Notifications</title>
  <style>
    :root {
      --page-bg: #f3f4f6;
      --text: #0f172a;
      --toast-bg: #ecfdf5;
      --toast-border: #15803d;
      --toast-text: #14532d;
      --toast-width: min(16rem, 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--page-bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 1fr var(--toast-width);
      margin: 0;
      min-height: 100dvh;
      min-width: 100dvw;
      padding: 2rem 1rem;
    }

    .controls {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .toggle {
      align-items: center;
      color: var(--text);
      display: inline-flex;
      font: inherit;
      gap: 0.5rem;
    }

    .toast-trigger {
      appearance: none;
      background: #fff;
      border: 1px solid #334155;
      border-radius: 999px;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      padding: 0.7rem 1.1rem;
    }

    .toast-trigger:focus-visible,
    .toast-close:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 2px;
    }

    .toast-region {
      align-items: flex-end;
      bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: calc(100dvh - 2rem);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0.5rem;
      position: fixed;
      right: 1rem;
      width: var(--toast-width);
    }

    .toast {
      align-items: center;
      background: var(--toast-bg);
      border: 1px solid var(--toast-border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      color: var(--toast-text);
      display: flex;
      gap: 0.5rem;
      justify-content: space-between;
      margin: 0;
      max-width: 16rem;
      min-height: min-content;
      padding: 0.875rem 1rem;
      position: relative;
      transition-behavior: allow-discrete;
      width: 100%;
    }

    .toast-close {
      align-self: flex-start;
      background: transparent;
      border: 1px solid var(--toast-border);
      border-radius: 8px;
      color: var(--toast-text);
      cursor: pointer;
      flex-shrink: 0;
      font: inherit;
      padding: 0.35rem 0.7rem;
    }

    .toast-message {
      margin: 0;
    }

    .visually-hidden:not(:focus):not(:active) {
      clip: rect(0 0 0 0); 
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap; 
      width: 1px;
    }

    @media (prefers-reduced-motion: no-preference) {
    }

  </style>
</head>
<body>
  <div class="controls">
    <button id="toast-trigger" class="toast-trigger" type="button">Trigger Toast</button>
    <label class="toggle" for="auto-dismiss-toggle">
      <input id="auto-dismiss-toggle" type="checkbox">
      Auto-dismiss after 3 seconds
    </label>
  </div>

  <div id="toast-region" class="toast-region" role="region" aria-label="Notifications"></div>
  <div id="toast-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <script>
    const toastRegion = document.getElementById('toast-region');
    const toastAnnouncer = document.getElementById('toast-announcer');
    const trigger = document.getElementById('toast-trigger');
    const autoDismissToggle = document.getElementById('auto-dismiss-toggle');
    const autoDismissTimers = new Map();
    let toastId = 1;

    function stopAutoDismiss(toast) {
      const timeoutId = autoDismissTimers.get(toast);

      if (timeoutId !== undefined) {
        window.clearTimeout(timeoutId);
        autoDismissTimers.delete(toast);
      }
    }

    function startAutoDismiss(toast) {
      stopAutoDismiss(toast);

      if (!autoDismissToggle.checked) {
        return;
      }

      const timeoutId = window.setTimeout(() => {
        if (toast.matches(':popover-open')) {
          toast.hidePopover();
        }

        stopAutoDismiss(toast);
        toast.remove();
      }, 3000);

      autoDismissTimers.set(toast, timeoutId);
    }

    function syncAutoDismissForAllToasts() {
      const allToasts = [...toastRegion.querySelectorAll('.toast')];

      for (const toast of allToasts) {
        if (autoDismissToggle.checked) {
          startAutoDismiss(toast);
        } else {
          stopAutoDismiss(toast);
        }
      }
    }

    function announceToast(message) {
      const text = (message || '').trim();

      if (!text) {
        return;
      }

      if (typeof window.ariaNotify === 'function') {
        window.ariaNotify(text);
        return;
      }

      toastAnnouncer.textContent = '';
      toastAnnouncer.textContent = text;
    }

    function focusNextToast(closedToast) {
      const allToasts = [...toastRegion.querySelectorAll('.toast')];
      const remaining = allToasts.filter((toast) => toast !== closedToast).length;

      if (remaining > 0) {
        let closedIndex = allToasts.indexOf(closedToast);
        // focus the next toast in the list, or the previous one if the closed toast was the last one
        let nextIndex = closedIndex - 1;
        if (closedIndex === 0) {
          if (remaining >= 1) {
            nextIndex = closedIndex + 1;
          } else {
            nextIndex = 0;
          }
        }
        const nextToast = allToasts[nextIndex];
        nextToast.querySelector('.toast-close').focus();
        return;
      } else {
        trigger.focus();
      }
    }

    function showToast(message = 'Saved successfully.') {
      const toast = document.createElement('div');
      const previousFocus = document.activeElement && document.activeElement !== document.body ? document.activeElement : trigger;

      toast.className = 'toast';
      toast.id = `toast-${toastId++}`;
      toast.dataset.previousFocus = previousFocus.id || 'toast-trigger';
      toast.setAttribute('popover', 'manual');
      toast.innerHTML = `
        <p class="toast-message">${message}</p>
        <button type="button" class="toast-close" popovertarget="${toast.id}" popovertargetaction="hide" aria-label="Close notification">Close</button>
      `;

      trigger.setAttribute('popovertarget', toast.id);
      toastRegion.appendChild(toast);

      toast.showPopover();
      announceToast(message);

      if (autoDismissToggle.checked) {
        startAutoDismiss(toast);
      }

      const closeButton = toast.querySelector('.toast-close');
      closeButton.addEventListener('click', (event) => {
        event.preventDefault();
        const currentToast = event.currentTarget.closest('.toast');

        stopAutoDismiss(currentToast);
        currentToast.hidePopover();
        focusNextToast(currentToast);

        currentToast.remove();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      trigger.addEventListener('click', () => {
        showToast();
      });
    });

    autoDismissToggle.addEventListener('change', () => {
      syncAutoDismissForAllToasts();
    });
  </script>
</body>
</html>
