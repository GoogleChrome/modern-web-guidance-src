<!DOCTYPE html>
<html lang="en">

<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <title>Translator Demo</title>
</head>

<body>
  <h1>Translator</h1>
  <p id="source" lang="en">The quick brown fox jumps over the lazy dog.</p>
  <form id="translate-form">
    <button type="submit">Translate</button>
  </form>
  <p id="translation"></p>

  <script type="module">
    const options = {
      sourceLanguage: 'en',
      targetLanguage: 'es',
    };

    let translator;

    const translateForm = document.getElementById('translate-form');
    const submitBtn = translateForm.querySelector('button');
    const p = document.getElementById('translation');

    if (!('Translator' in window)) {
      p.textContent = 'Client-side translation is currently unsupported in this browser.';
      submitBtn.disabled = true;
    }

    translateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const availability = await Translator.availability(options);
        if (availability === 'unavailable') {
          p.textContent = 'The translation model is unavailable on this device.';
          return;
        }

        if (availability === 'downloadable' || availability === 'downloading') {
          submitBtn.textContent = 'Downloading model...';
        } else if (availability === 'available') {
          submitBtn.textContent = 'Translating...';
        }

        if (!translator) {
          submitBtn.textContent = 'Initializing model...';
          submitBtn.disabled = true;
          translator = await Translator.create({
            ...options,
            monitor(m) {
              m.addEventListener('downloadprogress', (progressEvent) => {
                const total = progressEvent.total || 1;
                const pct = Math.round((progressEvent.loaded / total) * 100);
                submitBtn.textContent = `Downloading model... ${pct}%`;
              });
            },
          });
          submitBtn.textContent = 'Translate';
          submitBtn.disabled = false;
        }

        const text = document.getElementById('source').textContent;
        const stream = translator.translateStreaming(text);
        p.textContent = '';
        for await (const chunk of stream) {
          p.append(chunk);
        }
      } catch (err) {
        console.error(err);
        p.textContent = `Error: ${err.message}`;
        submitBtn.textContent = 'Translate';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
