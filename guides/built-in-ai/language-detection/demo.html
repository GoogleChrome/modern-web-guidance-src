<!DOCTYPE html>
<html lang="en">

<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <title>Language Detection Demo</title>
</head>

<body>
  <h1>Language Detection</h1>
  <p lang="es">Hola, ¿cómo estás?</p>
  <p lang="de">Hallo, wie geht's?</p>
  <form id="detect-form">
    <button type="submit">Detect Language</button>
  </form>
  <div id="results"></div>

  <button id="detect-btn">Detect Page Languages</button>
  <div id="output"></div>
 
  <script type="module">
    document.getElementById('detect-btn').addEventListener('click', async () => {
      const output = document.getElementById('output');
      output.textContent = 'Detecting...';
      try {
        if (!('LanguageDetector' in window)) {
          throw new Error('LanguageDetector not found');
        }
        const availability = await LanguageDetector.availability();
        if (availability === 'available' || availability === 'downloadable' || availability === 'downloading') {
          console.log('LanguageDetector is supported and can be used');
        }
        if (availability === 'unavailable') {
          throw new Error('LanguageDetector is not available');
        }
        const languageDetector = await LanguageDetector.create({
          monitor(m) {
            m.addEventListener('downloadprogress', (e) => {
              console.log(`Downloaded ${e.loaded * 100}%`);
            });
          },
        });
        
        output.innerHTML = '';
        for (const p of document.querySelectorAll('p')) {
          const result = await languageDetector.detect(p.textContent);
          const mostLikely = result[0];
          const resultText = `${p.textContent} -> Detected: ${mostLikely.detectedLanguage} (${Math.round(mostLikely.confidence * 100)}% confidence)`;
          console.log(resultText);
          const div = document.createElement('div');
          div.textContent = resultText;
          output.append(div);
        }
      } catch (e) {
        console.error(e);
        output.textContent = `Error: ${e.message}`;
      }
    });
  </script>
</body>

</html>
