<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Styling with :has()</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      border-left: 6px solid #ccc;
      /* Default neutral accent */
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eee;
    }

    h3 {
      margin: 0;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #767676;
      border-radius: 4px;
    }

    /* 
      --- PARENT STYLING LOGIC ---
      If the card contains an invalid input (after interaction),
      change the card's accent color and background.
    */

    /* :is() keeps each rule working where :user-invalid isn't supported: in a plain
       selector list, one unsupported selector drops the whole rule. */
    .card:is(:has(input:user-invalid), .has-error-fallback) {
      border-left-color: #d93025;
      background-color: #fff8f8;
      box-shadow: 0 4px 12px rgba(217, 48, 37, 0.1);
    }

    /* Update the status icon */
    .status-icon::after {
      content: "✅" / "";
    }

    /* The icon repeats what the field's error text says, so give it empty
       alternative text. */
    .card:is(:has(input:user-invalid), .has-error-fallback) .status-icon::after {
      content: "⚠️" / "";
    }

    /* Also style the input itself */
    input:is(:user-invalid, .user-invalid-fallback) {
      border-color: #d93025;
    }

    /* Field-level error text: the card styling doesn't say which field is wrong or why */
    .error-msg {
      display: none;
      color: #d93025;
      margin-top: 0.25rem;
    }

    input:is(:user-invalid, .user-invalid-fallback)+.error-msg {
      display: block;
    }

    .status-banner {
      padding: 1rem;
      background: #eee;
      margin-bottom: 1rem;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <h1>Parent Styling with :has()</h1>
  <p>Demonstrates styling a container based on the validity of its children using <code>:has(input:user-invalid)</code>.
  </p>

  <div style="margin-bottom: 1rem;">
    <label
      style="display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; background: #f0f0f0; padding: 0.5rem 1rem; border-radius: 4px;">
      <input type="checkbox" id="force-fallback">
      <strong>Force Fallback Mode</strong> (Simulate JS fallback)
    </label>
  </div>

  <div id="fallback-status" class="status-banner">
    Checking support...
  </div>

  <!-- The Parent Container -->
  <div class="card" id="profile-card">
    <div class="header">
      <h3>User Profile</h3>
      <span class="status-icon"></span>
    </div>

    <form id="demo-form" action="#" onsubmit="event.preventDefault();" novalidate>
      <div class="form-group">
        <label for="username">Username (Required)</label>
        <input type="text" id="username" name="username" required data-error="username-error">
        <div id="username-error" class="error-msg">Username is required.</div>
      </div>
      <div class="form-group">
        <label for="email">Email (Required)</label>
        <input type="email" id="email" name="email" required data-error="email-error">
        <div id="email-error" class="error-msg">Email address is missing or not valid. Enter it in the format you@example.com.</div>
      </div>
      <div style="display: flex; gap: 1rem;">
        <button type="submit">Save</button>
        <button type="reset">Reset</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('demo-form');
    const card = document.getElementById('profile-card');
    const statusDiv = document.getElementById('fallback-status');
    const forceFallbackCheckbox = document.getElementById('force-fallback');

    // 1. Feature Detection & Mode Switching
    const updateFeatureState = () => {
      const supportsHas = CSS.supports('selector(:has(a))');
      const supportsUserInvalid = CSS.supports('selector(:user-invalid)');
      const forced = forceFallbackCheckbox.checked;

      useNativeLogic = supportsHas && supportsUserInvalid && !forced;

      if (useNativeLogic) {
        statusDiv.textContent = "✅ Native :has() & :user-invalid supported.";
        statusDiv.style.background = "#e6f4ea";
        statusDiv.style.color = "#137333";
        card.classList.remove('has-error-fallback');
      } else {
        const reason = forced ? "(Forced)" : "(Missing support)";
        statusDiv.textContent = `⚠️ Using JS fallback logic ${reason}.`;
        statusDiv.style.background = "#fff8e1";
        statusDiv.style.color = "#8a4b00";
      }

      // Reset artifacts
      form.querySelectorAll('input').forEach(input => {
        input.classList.remove('user-invalid-fallback');
        input.classList.remove('user-valid-fallback');
        input.setAttribute('aria-invalid', 'false');
        linkError(input, false);
      });

      // Initialize
      if (!useNativeLogic) {
        UserInvalidFallback.init(form);
      } else {
        // Start every field at aria-invalid="false", or "true" if it's already :user-invalid
        document.querySelectorAll('input, select, textarea').forEach((el) => syncAria(el));
      }
    };

    forceFallbackCheckbox.addEventListener('change', () => {
      updateFeatureState();
    });

    // 2. The Fallback (Synced from guide.md)
    const UserInvalidFallback = (() => {
      const dirtyState = new WeakMap();

      const updateState = (input) => {
        // validity.valid gives the current state without firing an 'invalid' event, as checkValidity() does.
        const isValid = input.validity.valid;

        // Update both visual and ARIA state
        input.classList.toggle('user-invalid-fallback', !isValid);
        input.classList.toggle('user-valid-fallback', isValid);

        if (!isValid) {
          input.setAttribute('aria-invalid', 'true');
        } else {
          input.setAttribute('aria-invalid', 'false');
        }
        linkError(input, !isValid);
      };

      // List the error message (the id in data-error) in aria-describedby only while it's
      // shown: text that aria-describedby references is announced even when it's hidden.
      const linkError = (input, shown) => {
        const errorId = input.dataset.error;
        if (!errorId) return;
        const ids = (input.getAttribute('aria-describedby') || '').split(/\s+/).filter((id) => id && id !== errorId);
        if (shown) ids.push(errorId);
        if (ids.length) input.setAttribute('aria-describedby', ids.join(' '));
        else input.removeAttribute('aria-describedby');
      };

      const handleEvent = (event) => {
        if (useNativeLogic) return; // Listeners stay attached after leaving fallback mode

        const input = event.target;

        if (event.type === 'reset') {
          const controls = input.elements || [];
          for (const control of controls) {
            dirtyState.delete(control);
            control.classList.remove('user-invalid-fallback');
            control.classList.remove('user-valid-fallback');
            // form.elements includes buttons, which don't take aria-invalid
            if (control.matches('input, select, textarea')) control.setAttribute('aria-invalid', 'false');
            if (control.dataset?.error) linkError(control, false);
          }
          return;
        }

        if (!input.checkValidity) return;

        // A submit attempt counts as interaction: the browser fires 'invalid' on each failing
        // field, including required fields the user never touched, so flag them all.
        if (event.type === 'invalid') {
          dirtyState.set(input, { hasInteracted: true, hasBlurred: true });
          updateState(input);
          return;
        }

        if (event.type === 'input' || event.type === 'change') {
          const state = dirtyState.get(input) || { hasInteracted: false, hasBlurred: false };
          state.hasInteracted = true;
          dirtyState.set(input, state);
          if (state.hasBlurred) {
            updateState(input);
          }
        } else if (event.type === 'blur') {
          const state = dirtyState.get(input) || { hasInteracted: false, hasBlurred: false };
          state.hasBlurred = true;
          dirtyState.set(input, state);
          if (state.hasInteracted) {
            updateState(input);
          }
        }
      };

      const init = (root = document) => {
        const nativelySupported = CSS.supports('selector(:user-invalid)');
        if (nativelySupported && !forceFallbackCheckbox.checked) return;

        root.addEventListener('blur', handleEvent, true);
        root.addEventListener('input', handleEvent);
        root.addEventListener('change', handleEvent);
        root.addEventListener('invalid', handleEvent, true); // invalid doesn't bubble
        root.addEventListener('reset', handleEvent, true);
      };

      return { init };
    })();

    // List the field's error message (the id in data-error) in aria-describedby only while
    // it's shown: text that aria-describedby references is announced even when it's hidden.
    const linkError = (el, shown) => {
      const errorId = el.dataset.error;
      if (!errorId) return;
      const ids = (el.getAttribute('aria-describedby') || '').split(/\s+/).filter((id) => id && id !== errorId);
      if (shown) ids.push(errorId);
      if (ids.length) el.setAttribute('aria-describedby', ids.join(' '));
      else el.removeAttribute('aria-describedby');
    };

    // One polite live region for the page announces an error that appears when the user
    // leaves or changes a field. Run this once the form is in the page.
    const announcer = document.createElement('div');
    announcer.setAttribute('aria-live', 'polite');
    announcer.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;';
    document.body.append(announcer);
    let announceTimer;
    let announcedField;

    // Text as a screen reader reads it: icons' text alternatives in, aria-hidden text out.
    const spokenText = (node) => {
      const copy = node.cloneNode(true);
      copy.querySelectorAll('[aria-hidden="true"]').forEach((n) => n.remove());
      copy.querySelectorAll('[role="img"][aria-label]').forEach((n) => n.replaceWith(`${n.getAttribute('aria-label')}: `));
      return copy.textContent.replace(/\s+/g, ' ').trim();
    };
    const announceError = (el) => {
      const error = document.getElementById(el.dataset.error);
      if (!error) return;
      const label = el.labels?.[0] ? `${spokenText(el.labels[0])}: ` : '';
      clearTimeout(announceTimer);
      announcer.textContent = '';
      announcedField = el;
      // Wait until the screen reader has announced the field that receives focus next.
      announceTimer = setTimeout(() => { announcer.textContent = label + spokenText(error); }, 500);
    };

    // aria-invalid sync for native mode: mirror :user-invalid for screen readers. Only form
    // fields are synced, and an aria-invalid="true" that this script didn't set (for example
    // from a server check) is left alone.
    const flagged = new WeakSet();
    // Fields whose current error has been announced, or read out by focus after a failed
    // submit. A field can become invalid while the user types, so this is tracked separately.
    const announced = new WeakSet();
    const syncAria = (el, announce = false) => {
      if (!el.matches?.('input, select, textarea')) return;
      const invalid = el.matches(':user-invalid');
      if (invalid) {
        if (announce && !announced.has(el)) {
          announceError(el);
          announced.add(el);
        }
        el.setAttribute('aria-invalid', 'true');
        flagged.add(el);
      } else if (flagged.has(el) || el.getAttribute('aria-invalid') !== 'true') {
        el.setAttribute('aria-invalid', 'false');
        flagged.delete(el);
        announced.delete(el);
        // Clear a fixed field's announcement so it isn't found later when reading the page.
        if (announcedField === el) {
          clearTimeout(announceTimer);
          announcer.textContent = '';
        }
      }
      linkError(el, invalid);
    };

    // Update on blur (to show and announce an error) and input (to clear it)
    document.addEventListener('blur', (e) => {
      if (useNativeLogic) syncAria(e.target, true);
    }, true);

    document.addEventListener('input', (e) => {
      if (useNativeLogic && e.target.hasAttribute('aria-invalid')) syncAria(e.target);
    });

    // Checkboxes, radio buttons and other controls that commit on 'change' can become
    // :user-invalid without losing focus, so update on change too.
    document.addEventListener('change', (e) => {
      if (useNativeLogic) syncAria(e.target, true);
    }, true);

    // A failed submit fires 'invalid' on each failing field, including required fields the
    // user never touched, so update those too. 'invalid' doesn't bubble. Focus moving to the
    // first invalid field announces its error, so these aren't announced.
    document.addEventListener('invalid', (e) => {
      if (useNativeLogic) {
        announced.add(e.target);
        syncAria(e.target);
      }
    }, true);

    // Reset clears :user-invalid after the 'reset' event, so update each field afterwards.
    document.addEventListener('reset', (e) => {
      if (!useNativeLogic) return;
      setTimeout(() => [...e.target.elements].forEach((el) => syncAria(el)));
    }, true);

    // 3. Specialized Application Layer (Parent Styling)
    const updateParentStyles = (target) => {
      if (useNativeLogic) return;
      const container = target.closest('.card');
      if (!container) return;
      const hasError = container.querySelector(':is(:user-invalid, .user-invalid-fallback)');
      container.classList.toggle('has-error-fallback', !!hasError);
    };

    form.addEventListener('blur', (e) => {
      // Small timeout to ensure the fallback's capture-phase listener runs first
      setTimeout(() => updateParentStyles(e.target), 0);
    }, true);

    form.addEventListener('input', (e) => updateParentStyles(e.target));

    // invalid is the only event a submit attempt fires on fields the user never touched.
    // Wait a task so the fallback's listener has flagged the field first.
    form.addEventListener('invalid', (e) => {
      setTimeout(() => updateParentStyles(e.target), 0);
    }, true);

    // The card wraps the form, so re-check it after the fallback has cleared the fields
    form.addEventListener('reset', () => {
      setTimeout(() => updateParentStyles(form), 0);
    });

    // Submit: the form uses novalidate for its custom error UI, so the browser doesn't block
    // submission or move focus. Do both here so a failed submit is announced.
    form.addEventListener('submit', (event) => {
      if (form.checkValidity()) return; // checkValidity() fires 'invalid' on each failing field
      event.preventDefault();
      form.querySelector('input:invalid, select:invalid, textarea:invalid')?.focus();
    });

    // Init
    updateFeatureState();
  </script>
</body>

</html>
