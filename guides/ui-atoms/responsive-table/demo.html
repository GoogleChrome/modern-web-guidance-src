<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Table Demo: Staff Directory</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.5;
        margin: 2rem;
        max-inline-size: 1000px;
        margin-inline: auto;
        color: #333;
      }
      h1 {
        margin-block-end: 0.5rem;
      }
      p {
        margin-block-end: 2rem;
        color: #666;
      }
      .table-wrapper {
        container-type: inline-size;
        overflow: auto;
        max-inline-size: 100%;
        max-block-size: min(80vh, 600px);
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      table {
        inline-size: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      @container (width >= 600px) {
        th,
        td {
          border-block-end: 1px solid #eee;
          padding: 0.75rem 1rem;
          text-align: left;
          white-space: nowrap;
          background: white;
        }
        thead {
          position: sticky;
          inset-block-start: 0;
          z-index: 10;
        }
        thead th {
          background: #f4f4f4;
          font-weight: 600;
          border-block-end: 2px solid #ccc;
        }
        /* Sticky row headers (Names) */
        tbody th {
          position: sticky;
          inset-inline-start: 0;
          background: #f9f9f9;
          z-index: 5;
          font-weight: 600;
          border-inline-end: 1px solid #eee;
        }
        tr:hover td {
          background-color: #fcfcfc;
        }
      }
      @container (width < 600px) {
        table,
        thead,
        tbody,
        tr,
        th,
        td {
          display: block;
        }
        thead {
          display: none; /* Hide column headers in mobile view */
        }
        tr {
          margin-block-end: 1.5rem;
          border: 1px solid #ccc;
          border-radius: 4px;
          background: white;
        }
        tbody th {
          position: sticky;
          inset-block-start: 0;
          background: #eee;
          padding: 0.75rem;
          z-index: 5;
          font-size: 1.1rem;
          text-align: center;
          border-block-end: 1px solid #ccc;
        }
        td {
          display: flex;
          justify-content: space-between;
          padding: 0.5rem 0.75rem;
          border-block-end: 1px solid #eee;
        }
        td:last-child {
          border-block-end: none;
        }
        td::before {
          font-weight: 600;
          color: #666;
        }
        /* Labels injected via CSS variables set in JS */
        td:nth-child(2)::before {
          content: var(--label-2) ": " / var(--label-2);
        }
        td:nth-child(3)::before {
          content: var(--label-3) ": " / var(--label-3);
        }
        td:nth-child(4)::before {
          content: var(--label-4) ": " / var(--label-4);
        }
        td:nth-child(5)::before {
          content: var(--label-5) ": " / var(--label-5);
        }
        td:nth-child(6)::before {
          content: var(--label-6) ": " / var(--label-6);
        }
      }
    </style>
  </head>
  <body>
    <h1>Staff Directory</h1>
    <p>
      An example of a responsive data table. On desktop, it features sticky
      headers in both directions. On mobile viewports (or narrow containers), it
      transforms into a card-based layout.
    </p>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr id="header-row">
            <th>Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Office</th>
            <th>Status</th>
            <th>Joined</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Rows will be generated by JS -->
        </tbody>
      </table>
    </div>

    <script>
      const table = document.querySelector("table");
      const tableBody = document.getElementById("table-body");
      const headerRow = document.getElementById("header-row");
      const headers = Array.from(headerRow.querySelectorAll("th")).map(
        (th) => th.textContent,
      );

      // Set CSS variables for mobile labels
      headers.forEach((text, i) => {
        table.style.setProperty(`--label-${i + 1}`, `"${text}"`);
      });

      const staffData = [
        ["Alex Rivera", "Senior Engineer", "alex.r@example.com", "Seattle", "Active", "2021-03-15"],
        ["Jordan Smith", "Product Designer", "j.smith@example.com", "Remote", "On Leave", "2022-01-10"],
        ["Taylor Wong", "Marketing Lead", "t.wong@example.com", "New York", "Active", "2020-11-02"],
        ["Morgan Chen", "QA Analyst", "m.chen@example.com", "Seattle", "Active", "2023-05-22"],
        ["Casey Jones", "HR Manager", "casey.j@example.com", "Chicago", "Active", "2019-08-14"],
        ["Riley Taylor", "Frontend Developer", "riley.t@example.com", "Remote", "Active", "2022-07-01"],
        ["Jamie Doe", "DevOps Engineer", "jamie.d@example.com", "Seattle", "Active", "2021-12-12"],
        ["Sam Wilson", "Sales Exec", "sam.w@example.com", "New York", "Away", "2023-02-28"],
        ["Peyton Hill", "UX Researcher", "p.hill@example.com", "Remote", "Active", "2021-06-15"],
        ["Quinn Adams", "Data Scientist", "q.adams@example.com", "Chicago", "Active", "2020-04-19"],
      ];

      // Generate rows multiple times to demonstrate scrolling
      for (let i = 0; i < 5; i++) {
        staffData.forEach((staff) => {
          const tr = document.createElement("tr");
          
          staff.forEach((data, index) => {
            if (index === 0) {
              const th = document.createElement("th");
              th.textContent = staff[0];
              tr.appendChild(th);
            } else {
              const td = document.createElement("td");
              td.textContent = data;
              tr.appendChild(td);
            }
          });
          
          tableBody.appendChild(tr);
        });
      }
    </script>
  </body>
</html>
