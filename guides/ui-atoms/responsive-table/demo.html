<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Table Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 2rem;
        --z-col-header: 10;
      }
      table{
        inline-size: 100cqi;
      }
      .table-wrapper{
        container-type: inline-size;
        overflow: auto;
        max-inline-size: 100%;
        max-block-size: min(80vh, 500px);
      }
      @container (width >= 600px) {
        table {
          border-collapse: separate;
          border-spacing: 0;
          inline-size: 100%;
        }
        th,
        td {
          border: 1px solid #ccc;
          padding: 0.5rem;
          text-align: left;
          white-space: nowrap;
          background: white;
        }
        thead {
          position: sticky;
          inset-block-start: 0;
          z-index: var(--z-col-header);
        }
        thead th {
          background: #eee;
        }
        /* Sticky row headers - must stay on TH to stick horizontally within the row */
        th[scope="row"] {
          position: sticky;
          inset-inline-start: 0;
          background: #f9f9f9;
          z-index: 5;
        }
      }
      @container (width < 600px) {
        table, thead, tbody, tr, th, td {
          display: block;
        }
        thead {
          /* Visually hidden, display none can break screen readers */
          position: absolute !important;
          clip-path: inset(50%) !important;
          overflow: hidden !important;
          width: 1px !important;
          height: 1px !important;
          margin: -1px !important;
          padding: 0 !important;
          border: 0 !important;
          white-space: nowrap !important;
        }
        tbody {
          display: block;
          inline-size: 100%;
        }
        th[scope="row"] {
          inset-block-start: 0;
          position: sticky;
          background: #f9f9f9;
          z-index: 5;
        }
        tr {
          margin-block-end: 1rem;
          border: 1px solid #ccc;
        }
        td {
          display: flex;
          justify-content: space-between;
          padding: 0.5rem;
          border-block-end: 1px solid #eee;
        }
        td::before {
          content: attr(data-label) ": " / "";
          font-weight: bold;
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive Table Demo</h1>
    <p>
      A table with 100 rows and 20 columns, featuring 1 row of column headers
      and 1 column of row headers.
    </p>

    <div class="table-wrapper">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <script>
      const COLS = 20; // Total columns including row headers
      const ROWS = 100; // Total rows including column headers
      const tableHead = document.getElementById("table-head");
      const tableBody = document.getElementById("table-body");

      const tr = document.createElement("tr");
      for (let j = 1; j <= COLS; j++) {
        const th = document.createElement("th");
        th.setAttribute("scope", "col");
        if (j === 1) {
          th.textContent = `Corner,${j}`;
        } else {
          th.textContent = `Col Header ${j}`;
        }
        tr.appendChild(th);
      }
      tableHead.appendChild(tr);

      // Create 100 rows of data
      for (let i = 1; i <= ROWS; i++) {
        const tr = document.createElement("tr");
        // Row headers
        const th = document.createElement("th");
        th.setAttribute("scope", "row");
        th.textContent = `Row Head ${i}`;
        tr.appendChild(th);
        for (let j = 2; j <= COLS; j++) {
          // Data cells
          const td = document.createElement("td");
          td.dataset.label = `Col Header ${j}`;
          td.textContent = `Data ${i},${j}`;
          tr.appendChild(td);
        }
        tableBody.appendChild(tr);
      }
    </script>
  </body>
</html>
