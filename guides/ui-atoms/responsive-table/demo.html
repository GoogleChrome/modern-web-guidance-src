<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Table Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 2rem;
        --z-col-header: 10;
      }
      table {
        inline-size: 100cqi;
      }
      .table-wrapper {
        container-type: inline-size;
        overflow: auto;
        max-inline-size: 100%;
        max-block-size: min(80vh, 500px);
      }
      @container (width >= 600px) {
        table {
          border-collapse: separate;
          border-spacing: 0;
          inline-size: 100%;
        }
        th,
        td {
          border: 1px solid #ccc;
          padding: 0.5rem;
          text-align: left;
          white-space: nowrap;
          background: white;
        }
        thead {
          position: sticky;
          inset-block-start: 0;
          z-index: var(--z-col-header);
        }
        thead th {
          background: #eee;
        }
        /* Sticky row headers - must stay on TH to stick horizontally within the row */
        th[scope="row"] {
          position: sticky;
          inset-inline-start: 0;
          background: #f9f9f9;
          z-index: 5;
        }
      }
      @container (width < 600px) {
        table,
        thead,
        tbody,
        tr,
        th,
        td {
          display: block;
        }
        thead {
          display: none;
        }
        tbody {
          display: block;
          inline-size: 100%;
        }
        th[scope="row"] {
          inset-block-start: 0;
          position: sticky;
          background: #f9f9f9;
          z-index: 5;
        }
        tr {
          margin-block-end: 1rem;
          border: 1px solid #ccc;
        }
        td {
          display: flex;
          justify-content: space-between;
          padding: 0.5rem;
          border-block-end: 1px solid #eee;
        }
        td::before {
          font-weight: bold;
        }
        td:nth-child(1)::before {
          content: var(--column-label-1) ": " / var(--column-label-1);
        }
        td:nth-child(2)::before {
          content: var(--column-label-2) ": " / var(--column-label-2);
        }
        td:nth-child(3)::before {
          content: var(--column-label-3) ": " / var(--column-label-3);
        }
        td:nth-child(4)::before {
          content: var(--column-label-4) ": " / var(--column-label-4);
        }
        td:nth-child(5)::before {
          content: var(--column-label-5) ": " / var(--column-label-5);
        }
        td:nth-child(6)::before {
          content: var(--column-label-6) ": " / var(--column-label-6);
        }
        td:nth-child(7)::before {
          content: var(--column-label-7) ": " / var(--column-label-7);
        }
        td:nth-child(8)::before {
          content: var(--column-label-8) ": " / var(--column-label-8);
        }
        td:nth-child(9)::before {
          content: var(--column-label-9) ": " / var(--column-label-9);
        }
        td:nth-child(10)::before {
          content: var(--column-label-10) ": " / var(--column-label-10);
        }
        td:nth-child(11)::before {
          content: var(--column-label-11) ": " / var(--column-label-11);
        }
        td:nth-child(12)::before {
          content: var(--column-label-12) ": " / var(--column-label-12);
        }
        td:nth-child(13)::before {
          content: var(--column-label-13) ": " / var(--column-label-13);
        }
        td:nth-child(14)::before {
          content: var(--column-label-14) ": " / var(--column-label-14);
        }
        td:nth-child(15)::before {
          content: var(--column-label-15) ": " / var(--column-label-15);
        }
        td:nth-child(16)::before {
          content: var(--column-label-16) ": " / var(--column-label-16);
        }
        td:nth-child(17)::before {
          content: var(--column-label-17) ": " / var(--column-label-17);
        }
        td:nth-child(18)::before {
          content: var(--column-label-18) ": " / var(--column-label-18);
        }
        td:nth-child(19)::before {
          content: var(--column-label-19) ": " / var(--column-label-19);
        }
        td:nth-child(20)::before {
          content: var(--column-label-20) ": " / var(--column-label-20);
        }
      }
    </style>
  </head>
  <body>
    <h1>Responsive Table Demo</h1>
    <p>
      A table with 100 rows and 20 columns, featuring 1 row of column headers
      and 1 column of row headers.
    </p>

    <div class="table-wrapper">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <script>
      const COLS = 20; // Total columns including row headers
      const ROWS = 100; // Total rows including column headers
      const tableHead = document.getElementById("table-head");
      const tableBody = document.getElementById("table-body");

      const table = document.querySelector("table");

      const tr = document.createElement("tr");
      for (let j = 1; j <= COLS; j++) {
        const th = document.createElement("th");
        th.setAttribute("scope", "col");
        const headerText = j === 1 ? `Corner,${j}` : `Col Header ${j}`;
        th.textContent = headerText;
        tr.appendChild(th);

        // Set CSS variable for labels in stacked view
        table.style.setProperty(`--column-label-${j}`, `"${headerText}"`);
      }
      tableHead.appendChild(tr);

      // Create 100 rows of data
      for (let i = 1; i <= ROWS; i++) {
        const tr = document.createElement("tr");
        // Row headers
        const th = document.createElement("th");
        th.setAttribute("scope", "row");
        th.innerText = `Row Head ${i}`;
        tr.appendChild(th);
        for (let j = 2; j <= COLS; j++) {
          // Data cells
          const td = document.createElement("td");
          td.dataset.label = `Col Header ${j}`;
          td.textContent = `Data ${i},${j}`;
          tr.appendChild(td);
        }
        tableBody.appendChild(tr);
      }
    </script>
  </body>
</html>
