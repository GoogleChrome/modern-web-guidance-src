  <meta charset="UTF-8">

  <title>Scroll-Driven Animations: Carousel Item Effects</title>
  <script src="https://unpkg.com/scroll-timeline-polyfill"></script>
  <style>
    * {
      margin: 0;
      padding: 0;

    }
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scroller {

      overflow-x: scroll;
      border: 1px solid black;
      padding: 1rem;
      width: 800px;
      max-width: 90vw;
      list-style: none;
    }
    @keyframes animate {
      0% {
        width: 100px;
        height: 150px;
      }
      100% {
        width: 300px;
        height: 450px;
      }
    }
    .entry {
      flex-shrink: 0;
      border: 1px solid black;
