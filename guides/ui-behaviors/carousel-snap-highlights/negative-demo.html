<html lang="en">
  <head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Snap Highlights</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f9f9f9;
      }

      .carousel {
        display: flex;
        gap: 20px;
        width: 100%;
        max-width: 600px;
        overflow-x: scroll;
        padding: 40px calc(50% - 100px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      .carousel-item {
        flex: 0 0 200px;
        height: 250px;
      }

      .card {
        height: 100%;
        background: #e0e0e0;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
        color: #666;
        width: 100%;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .card:hover {
        background: #ffc107;
        color: #333;
      }

      .card:active {
        background: #dc3545;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="carousel">
      <div class="carousel-item"><button class="card">1</button></div>
      <div class="carousel-item"><button class="card">2</button></div>
      <div class="carousel-item"><button class="card">3</button></div>
      <div class="carousel-item"><button class="card">4</button></div>
      <div class="carousel-item"><button class="card">5</button></div>
    </div>
    <script>
      const cards = document.querySelectorAll(".card");
      cards.forEach((card) => {
        card.addEventListener("click", () => {
          cards.forEach((c) => (c.style.transform = ""));
          card.style.transform = "rotate(360deg)";
        });
      });
    </script>
  </body>
</html>
