<!doctype html>
<html lang="en">
  <head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchor Positioning Tab Underline</title>
    <style>
      ul {
        padding: 0;
        margin: 0;
        list-style: none;
        display: flex;
        gap: 1rem;
        font-size: 1.5rem;
        position: relative;
      }

      .underline {
        position: absolute;
        position-anchor: --active-item;
        position-area: bottom;
        height: 10px;
        width: 100px;
        background: blue;
        transition: all 0.5s;
      }

      ul li.active {
        anchor-name: --active-item;
        font-weight: bold;
      }

      ul li a {
        color: #333;
        text-decoration: none;
        padding: 0.5rem;
        display: block;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li class="active"><a href="#">Home</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Team</a></li>
      </ul>
      <div class="underline"></div>
    </nav>
    <script>
      const links = document.querySelectorAll('ul li');
      links.forEach(li => {
        li.addEventListener('click', (e) => {
          e.preventDefault();
          document.querySelector('li.active').classList.remove('active');
          li.classList.add('active');
        });
      });
    </script>
  </body>
</html>
