<!DOCTYPE html>
<html lang="en">
<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-Driven Animations: Parallax Animation</title>
  <style>
    @layer reset, base, demo;

    @layer demo {
      @media (prefers-reduced-motion: no-preference) {
        @supports ((animation-timeline: scroll())) {
          @keyframes parallax {
            from {
              transform: translateY(700px);
            }
          }

          .wrapper {
            view-timeline: --wrapper;
          }

          .layer {
            animation: parallax linear both;
            animation-timeline: --wrapper;
            animation-range: entry 25% exit calc(100% / sibling-count() * sibling-index());
          }
        }
      }
    }

    @layer base {
      html {
        height: 100%;
      }
      body {
        height: 400dvh;
      }
      .wrapper {
        position: relative;
        height: 100vh;
        border: 1px dotted;
        overflow: clip;
      }

      .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        place-content: center;
        text-align: center;
        font-size: 10dvw;
        color: hsl(0 0% 0% / 0.2);
      }
    }

    @layer reset {
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      ul[class] {
        list-style: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="layer">LAYER 0</div>
    <div class="layer">LAYER 1</div>
    <div class="layer">LAYER 2</div>
    <div class="layer">LAYER 3</div>
    <div class="layer">LAYER 4</div>
    <div class="layer">LAYER 5</div>
    <div class="layer">LAYER 6</div>
  </div>
</body>
</html>
