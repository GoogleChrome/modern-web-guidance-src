<html lang="en">
<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Layer Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      display: flex;
      gap: 2rem;
    }
    .container {
      border: 2px dashed #ccc;
      padding: 1rem;
      min-height: 200px;
      min-width: 300px;
    }
    dialog {
      padding: 1rem;
      border: 1px solid #cc0000;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div>
    <h2>Container A</h2>
    <div id="container-a" class="container">
      <dialog id="my-dialog">
        <p>I am a dialog!</p>
        <button id="move-btn">Move Dialog to Container B</button>
        <form method="dialog" style="margin-top: 1rem;">
          <button>Close</button>
        </form>
      </dialog>
      <button id="open-btn">Open Dialog</button>
    </div>
  </div>

  <div>
    <h2>Container B</h2>
    <div id="container-b" class="container"></div>
  </div>

  <script>
    const dialog = document.getElementById('my-dialog');
    const openBtn = document.getElementById('open-btn');
    const moveBtn = document.getElementById('move-btn');
    const containerA = document.getElementById('container-a');
    const containerB = document.getElementById('container-b');

    openBtn.addEventListener('click', () => {
      dialog.showModal();
    });

    moveBtn.addEventListener('click', () => {
      const currentParent = dialog.parentElement;
      const targetParent = currentParent === containerA ? containerB : containerA;

      moveBtn.textContent = `Move Dialog to Container ${targetParent === containerA ? 'B' : 'A'}`;

      targetParent.appendChild(dialog);
    });
  </script>
</body>
</html>
