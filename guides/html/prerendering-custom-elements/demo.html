<!DOCTYPE html>

<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declarative Shadow DOM: server-rendered, hydrated in place</title>
</head>
<body>
  <!-- This markup represents server output: the shadow root and its styles ship
       as HTML, so the component is correct on first paint, before any JS runs. -->
  <my-card>
    <template shadowrootmode="open">
      <style>
        :host { display: block; max-inline-size: 24rem; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; }
        :host([open]) .card { border-color: #06f; }
        button { cursor: pointer; }
      </style>
      <div class="card">
        <slot name="header"></slot>
        <div class="body"><slot></slot></div>
        <button type="button" id="toggle">Toggle details</button>
      </div>
    </template>

    <h2 slot="header">Server-rendered title</h2>
    <p>Visible and styled before JS loads.</p>
  </my-card>

  <script>
    class MyCard extends HTMLElement {
      constructor() {
        super();
        // Reuse the server-rendered shadow root; only create one if it is absent.
        if (!this.shadowRoot) {
          this.attachShadow({ mode: 'open' });
          // (Client-only path would clone a template here.)
        }
        // Hydrate in place: wire behavior once to existing markup. Do NOT re-render;
        // that would discard the server's DOM and cause a flash.
        this.shadowRoot.getElementById('toggle')
          ?.addEventListener('click', () => {
            this.toggleAttribute('open');
          });
      }
    }

    customElements.define('my-card', MyCard);
  </script>
</body>
</html>
