<!DOCTYPE html>
<html lang="en">

<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <title>Defer Work Until Scroll Ends Demo</title>
  <style>
    .scroll-container {
      height: 300px;
      overflow-y: auto;
      border: 2px solid #ccc;
      padding: 16px;
    }

    .content-section {
      height: 250px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      background: #f0f0f0;
      border-radius: 8px;
    }

    #status {
      padding: 12px;
      margin-top: 12px;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <h1>Defer Work Until Scroll Ends</h1>

  <div class="scroll-container" id="scroller">
    <div class="content-section">Section 1</div>
    <div class="content-section">Section 2</div>
    <div class="content-section">Section 3</div>
    <div class="content-section">Section 4</div>
    <div class="content-section">Section 5</div>
  </div>

  <div id="status">Waiting for scroll...</div>

  <script>
    function initializeDemo() {
      const scroller = document.getElementById('scroller');
      const status = document.getElementById('status');

      // During scroll, avoid expensive work to keep animations smooth.
      scroller.addEventListener('scroll', () => {
        status.textContent = 'Scrolling... (deferring updates)';
      });

      // Once scrolling completes, perform the deferred expensive work.
      scroller.addEventListener('scrollend', () => {
        // Determine which section is most visible.
        const sections = scroller.querySelectorAll('.content-section');
        const scrollTop = scroller.scrollTop;
        const containerHeight = scroller.clientHeight;
        let bestMatch = sections[0];
        let bestOverlap = 0;

        for (const section of sections) {
          const top = section.offsetTop - scroller.offsetTop;
          const bottom = top + section.offsetHeight;
          const visibleTop = Math.max(top, scrollTop);
          const visibleBottom = Math.min(bottom, scrollTop + containerHeight);
          const overlap = Math.max(0, visibleBottom - visibleTop);

          if (overlap > bestOverlap) {
            bestOverlap = overlap;
            bestMatch = section;
          }
        }

        // Simulate an expensive task like fetching data or recalculations
        status.textContent = `Scroll ended. Visible: ${bestMatch.textContent}`;
      });
    }

    if ('onscrollend' in window) {
      initializeDemo();
    } else {
      initializeDemo();
      const scroller = document.getElementById('scroller');
      scroller.addEventListener('scroll', () => {
        clearTimeout(window.scrollendtimer);
        window.scrollendtimer = setTimeout(() => {
          scroller.dispatchEvent(new CustomEvent('scrollend'));
        }, 100);
      });
    }
  </script>
</body>

</html>
