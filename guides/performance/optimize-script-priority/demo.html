<!DOCTYPE html>
<html lang="en">

<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <title>Optimize Script Priority Demo</title>
</head>

<body>
  <h1>Optimize Script Priority</h1>

  <!-- 
    1. Boosted Async Script: 
    Explicitly set to high priority. Use this for scripts critical to 
    user interactivity so they download fast without blocking the parser.
  -->
  <script src="/js/app.js" async fetchpriority="high"></script>

  <!-- 
    2. Default Async Script: 
    Implicitly "Low" priority. Perfect for background analytics or 
    non-essential widgets.
  -->
  <script src="/js/tracker.js" async></script>

  <!-- Simulating an LCP image that needs bandwidth -->
  <img src="https://picsum.photos/id/10/600/400" alt="LCP Image" width="600" height="400" fetchpriority="high">

  <!-- 
    3. Deprioritized Legacy Script that are at the end of the page and so not blocking the rest of the page load: 
    Normally, standard scripts get a High/Medium priority. 
    Using fetchpriority="low" helps ensure this doesn't delay higher priority resources.
  -->
  <script src="/js/legacy-widgets.js" fetchpriority="low"></script>

</body>

</html>
