<!DOCTYPE html>
<html lang="en">

<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <title>Optimize Image Priority Demo</title>
</head>

<body>
  <h1>Product Landing Page</h1>

  <!-- LCP Image: Boosted to High Priority -->
  <img src="hero-lcp.jpg" alt="Product Hero" fetchpriority="high" width="600" height="400">

  <div class="gallery">
    <!-- Visible gallery image -->
    <img src="gallery-main.jpg" alt="Main Gallery Image" width="300" height="200">

    <!-- Hidden Gallery Image: Dropped to Low Priority -->
    <img src="gallery-alt.jpg" alt="Secondary Gallery Image" fetchpriority="low" loading="lazy" width="300" height="200"
      style="display: none;">
  </div>
  <nav>
    <ul>
      <li>Products
        <div class="mega-menu" style="display: none;">
          <!-- Image hidden in a dropdown: Dropped to Low Priority -->
          <img src="mega-menu-promo.jpg" alt="Special Offer" fetchpriority="low" width="300" height="150">
        </div>
      </li>
    </ul>
  <footer style="margin-top: 2000px;">
    <!-- Below the fold image: Should NOT have fetchpriority="low" if it's already lazy-loaded -->
    <img src="footer-logo.png" alt="Footer Logo" loading="lazy" width="120" height="60">
  </footer>
</body>

</html>
