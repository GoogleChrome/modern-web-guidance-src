<!DOCTYPE html>
<html lang="en">

<head><script>(() => { if (!location.search.includes("preview=1")) return; let ok = false; addEventListener("pointerdown", () => { ok = true; }, true); addEventListener("keydown", () => { ok = true; }, true); const f = HTMLElement.prototype.focus; HTMLElement.prototype.focus = Element.prototype.focus = function(o) { if (ok) return f.call(this, Object.assign({}, o, { preventScroll: true })); }; for (const k of ["scrollIntoView", "scrollIntoViewIfNeeded"]) { const fn = Element.prototype[k]; if (fn) Element.prototype[k] = function(o) { if (ok) return fn.call(this, o); }; } const s = new CSSStyleSheet(); s.replaceSync("*,*::before,*::after{scroll-initial-target:none!important}"); document.adoptedStyleSheets = [...document.adoptedStyleSheets, s]; new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) { n.removeAttribute?.("autofocus"); n.querySelectorAll?.("[autofocus]").forEach(e => e.removeAttribute("autofocus")); } }).observe(document, { childList: true, subtree: true }); })();</script>
  <meta charset="UTF-8">
  <title>Avoid Redundant Large Asset Downloads Demo</title>
</head>

<body>
  <h1>Load a shared library via Cross-Origin Storage</h1>
  <p>This loads a large, popular library that many unrelated sites already share in Cross-Origin Storage (COS),
    instead of downloading a fresh copy on this origin.</p>
  <button id="load-btn">Load shared library</button>
  <div id="status"></div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const loadBtn = document.getElementById('load-btn');

    // navigator.crossOriginStorage is undefined in browsers with no COS
    // implementation. Guard every access with optional chaining so the
    // page falls back to plain network loading instead of throwing.
    const supportsCOS = !!navigator.crossOriginStorage?.getFileHandle;
    if (!supportsCOS) {
      statusEl.textContent = 'Cross-Origin Storage is unavailable here -- loading over the network as normal.';
    }

    loadBtn.addEventListener('click', async () => {
      loadBtn.disabled = true;
      const fileBlob = await loadAsset(
        '/assets/shared-library.js',
        {
          algorithm: 'SHA-256',
          // The hash a real deployment computes once at build time from the
          // exact bytes of the shared library (via crypto.subtle.digest()).
          // Computing it on page load would require downloading the file first.
          value: '8f434346648f6b96df89dda901c5176b10a6d83961dd3c1ac88b59b2dc327aa4',
        },
        // MANDATORY: origins: '*' is only appropriate for genuinely popular,
        // non-proprietary resources -- this stands in for a widely-shared
        // public library. A proprietary asset should instead use an
        // explicit origins list, or omit origins for same-site-only sharing.
        '*',
      );
      statusEl.textContent = `Library ready (${fileBlob.size} bytes).`;
      loadBtn.disabled = false;
    });

    /**
     * Loads a large shared asset from COS when available, otherwise from the
     * network, and stores network responses in COS for the next origin.
     * @param {string} url The asset's real, working network URL.
     * @param {{algorithm: string, value: string}} hash The build-time hash.
     * @param {'*' | string[]} [origins] Sharing scope; omit for same-site only.
     * @returns {Promise<Blob>}
     */
    async function loadAsset(url, hash, origins) {
      // Set when Permissions Policy blocks COS in this context, since every
      // further COS call here rejects the same way.
      let blocked = false;

      if (supportsCOS) {
        try {
          // Check COS first. If another origin already stored this exact
          // hash, this resolves with no network request at all.
          const handle = await navigator.crossOriginStorage.getFileHandle(hash);
          statusEl.textContent = 'Found in Cross-Origin Storage -- no download needed.';
          return await handle.getFile();
        } catch (err) {
          // A NotFoundError does not prove the file is absent from COS --
          // the user agent may be withholding it for privacy reasons. Either
          // way, fall back to the network; never treat this as fatal.
          //
          // NotAllowedError means Permissions Policy blocks COS in this
          // context -- distinct from a cache miss, so skip the write-back too.
          blocked = err.name === 'NotAllowedError';
          statusEl.textContent = err.name === 'NotFoundError'
            ? 'Not found in Cross-Origin Storage -- downloading instead.'
            : `Cross-Origin Storage unavailable (${err.name}) -- downloading instead.`;
        }
      }

      const response = await fetch(url);
      const fileBlob = await response.blob();

      if (supportsCOS && !blocked) {
        // Store the file for the next origin that requests the same hash.
        try {
          const handle = await navigator.crossOriginStorage.getFileHandle(hash, {
            create: true,
            // Only pass `origins` when the caller chose a scope, so omitting it
            // keeps the same-site-only default.
            ...(origins && { origins }),
          });
          const writable = await handle.createWritable();
          // Always write the complete file, even if it might already exist
          // in COS -- this is what lets the user agent verify the hash and
          // is what prevents a write from being used to probe prior presence.
          await writable.write(fileBlob);
          await writable.close();
          // Never call getFile() on this handle before write()/close() has
          // resolved; the blob already in hand is what's returned below.
        } catch {
          // Storing is a nice-to-have for future visitors, not required for
          // this page to work -- the file is already loaded and usable.
        }
      }

      return fileBlob;
    }
  </script>
</body>

</html>
