<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Avoid Redundant Large Asset Downloads Demo</title>
</head>

<body>
  <h1>Load a shared Wasm module</h1>
  <p>This loads the ffmpeg.wasm core module over the network every time, even though many unrelated video-editing
    sites already share an identical copy.</p>
  <button id="load-btn">Load shared library</button>
  <div id="status"></div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const loadBtn = document.getElementById('load-btn');

    loadBtn.addEventListener('click', async () => {
      loadBtn.disabled = true;
      const fileBlob = await loadModule();
      statusEl.textContent = `Library ready (${fileBlob.size} bytes).`;
      loadBtn.disabled = false;
    });

    async function loadModule() {
      // Never checks Cross-Origin Storage first, so every origin downloads
      // and stores its own copy of the same bytes.
      const response = await fetch('/assets/ffmpeg-core.wasm');
      return await response.blob();
    }
  </script>
</body>

</html>
