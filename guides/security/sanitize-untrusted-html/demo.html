<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanitizer API Demo</title>
    <style>
      @layer reset, base, demo;

      .blue-text{
        color: blue;
      }

      @layer base {
        body {
          font-family: system-ui, sans-serif;
          line-height: 1.5;
          max-width: 800px;
          margin: 2rem auto;
          padding: 0 1rem;
        }

        section {
          margin-bottom: 2rem;
          padding: 1rem;
          border: 1px solid #ccc;
          border-radius: 8px;
        }

        h2 {
          margin-top: 0;
        }

        textarea {
          width: 100%;
          height: 120px;
          font-family: monospace;
          margin-bottom: 1rem;
          padding: 0.5rem;
          border: 1px solid #999;
        }

        .controls {
          display: flex;
          gap: 1rem;
          margin-bottom: 1rem;
        }

        button {
          padding: 0.5rem 1rem;
          cursor: pointer;
          background: #eee;
          border: 1px solid #999;
          border-radius: 4px;
        }

        button:hover {
          background: #ddd;
        }

        .output-label {
          font-weight: bold;
          margin-top: 1rem;
          display: block;
        }

        .output-box {
          padding: 1rem;
          background: #f9f9f9;
          border: 1px dashed #999;
          min-height: 50px;
          margin-top: 0.5rem;
        }

        code {
          background: #eee;
          padding: 0.2rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Sanitizer API Demo</h1>

    <section>
      <h2>Untrusted Input</h2>
      <textarea id="untrusted-input">
<p class="blue-text">Safe text with <b>bold</b>.</p>
<script>console.log('XSS Triggered!')</script>
<img src="x" onerror="console.log('Event Triggered!')">
<div style="color: blue;" onclick="alert('clicked')">Styled div with click handler</div>
    </textarea
      >
      <div class="controls">
        <button id="btn-run">Process HTML</button>
      </div>
    </section>

    <section>
      <h2>Results</h2>

      <span class="output-label"
        >Output 1: <code>Element.setHTML()</code> (Default Sanitization)</span
      >
      <div id="output-set" class="output-box"></div>

      <span class="output-label"
        >Output 2: <code>Element.setHTML({sanitizer})</code> (Custom
        Config)</span
      >
      <div id="output-custom" class="output-box"></div>

      <span class="output-label">Output 3: <code>Document.parseHTML()</code> (Sanitized Nodes)</span>
      <div id="output-parsed" class="output-box"></div>
    </section>

    <script type="module">
      // Pinned exact version; in production, bundle DOMPurify and code-split it instead.
      const DOMPURIFY_URL = "https://unpkg.com/dompurify@3.4.16/dist/purify.es.mjs";
      let domPurifyPromise;

      function loadDOMPurify() {
        domPurifyPromise ??= import(DOMPURIFY_URL).then((mod) => mod.default ?? mod);
        return domPurifyPromise;
      }

      const hasSetHTML = "setHTML" in Element.prototype;
      const hasParseHTML = "parseHTML" in Document;
      if (!hasSetHTML || !hasParseHTML) {
        loadDOMPurify();
      }

      const customConfig = {
        elements: ["p", "b", "i", "strong", "em"],
        attributes: ["class"],
      };

      const input = document.getElementById("untrusted-input");
      const outSet = document.getElementById("output-set");
      const outCustom = document.getElementById("output-custom");
      const outParsed = document.getElementById("output-parsed");

      document.getElementById("btn-run").addEventListener("click", async () => {
        const rawHTML = input.value;

        // 1. setHTML() with the default sanitizer
        // 2. setHTML() with a custom configuration
        if (hasSetHTML) {
          outSet.setHTML(rawHTML);
          outCustom.setHTML(rawHTML, { sanitizer: customConfig });
        } else {
          const DOMPurify = await loadDOMPurify();
          outSet.innerHTML = DOMPurify.sanitize(rawHTML);
          outCustom.innerHTML = DOMPurify.sanitize(rawHTML, {
            ALLOWED_TAGS: [...customConfig.elements, "#text"],
            ALLOWED_ATTR: customConfig.attributes,
            // Match the native Sanitizer: remove disallowed elements with their content
            KEEP_CONTENT: false,
          });
        }

        // 3. Document.parseHTML(): move the sanitized nodes into the page
        if (hasParseHTML) {
          const doc = Document.parseHTML(rawHTML);
          outParsed.replaceChildren(...doc.body.childNodes);
        } else {
          const DOMPurify = await loadDOMPurify();
          outParsed.replaceChildren(DOMPurify.sanitize(rawHTML, { RETURN_DOM_FRAGMENT: true }));
        }
      });
    </script>
  </body>
</html>
