<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanitizer API Negative Demo (Unsafe Anti-Pattern)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      section {
        margin-bottom: 2rem;
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      textarea {
        width: 100%;
        height: 120px;
        font-family: monospace;
        margin-bottom: 1rem;
        padding: 0.5rem;
      }

      .output-box {
        padding: 1rem;
        background: #f9f9f9;
        border: 1px dashed #999;
        min-height: 50px;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Sanitizer API Demo (Anti-Pattern)</h1>

    <section>
      <h2>Untrusted Input</h2>
      <textarea id="untrusted-input" data-testid="review-input">
<p class="blue-text">Safe text with <b>bold</b>.</p>
<script>console.log('XSS Triggered!')</script>
<img src="x" onerror="console.log('Event Triggered!')">
<div style="color: blue;" onclick="alert('clicked')">Styled div with click handler</div>
      </textarea>
      <div class="controls">
        <button id="btn-run" data-testid="preview-button">Process HTML</button>
      </div>
    </section>

    <section>
      <h2>Results</h2>
      <div id="output-set" class="output-box"></div>
      <div id="output-custom" data-testid="review-output" class="output-box"></div>
      <div id="output-sanitized" class="output-box"></div>
    </section>

    <script type="module">
      const input = document.getElementById("untrusted-input");
      const outSet = document.getElementById("output-set");
      const outCustom = document.getElementById("output-custom");
      const outputSanitized = document.getElementById("output-sanitized");

      document.getElementById("btn-run").addEventListener("click", () => {
        // Anti-pattern: assigning raw untrusted HTML directly via innerHTML without Sanitizer or DOMPurify
        const rawHTML = input.value.replace(/class="[^"]*"/g, "");
        outSet.innerHTML = rawHTML;
        outCustom.innerHTML = rawHTML;
        outputSanitized.innerText = rawHTML;
      });
    </script>
  </body>
</html>
