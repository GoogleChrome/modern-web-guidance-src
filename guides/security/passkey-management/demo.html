<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Passkey Management Demo</title>
</head>
<body>
  <div class="card">
    <h2>Manage Your Passkeys</h2>
    <p>Sync state with your password manager in real-time.</p>

    <div id="profile-section" style="margin-bottom: 1rem;">
      <span id="user-display-name" data-testid="user-display-name">Ada Lovelace (user@example.com)</span>
      <button id="rename-user-btn" data-testid="rename-user-button" type="button">Edit Profile Name</button>
    </div>
    
    <div id="list-container" class="credential-list" data-testid="credential-list">
      <!-- Managed Credential items will load here -->
    </div>

    <button id="create-btn" data-testid="create-passkey-button" style="display:none; margin-top: 1rem; background:#0066cc;">Create Passkey</button>
    <div id="status" style="margin-top: 1rem; font-weight: bold;" data-testid="management-status">Idle</div>
  </div>

  <script type="module">
      import aaguids from '/aaguids.json' with { type: 'json' };

    // Populated from server API responses (never derived from window.location.hostname)
    let serverRpId = null;
    let serverUserId = null;

    function isValidBase64Url(value) {
      return typeof value === 'string' &&
        value.length > 0 &&
        value.length % 4 !== 1 &&
        /^[A-Za-z0-9_-]+$/.test(value);
    }

    async function gateCreatePasskeyButton() {
      const btn = document.getElementById('create-btn');
      if (window.PublicKeyCredential) {
        const capabilities = await PublicKeyCredential.getClientCapabilities();
        if (capabilities?.passkeyPlatformAuthenticator) {
          btn.style.display = 'inline-block';
        }
      }
    }

    async function syncAcceptedCredentials(rpId, userId, currentList) {
      if (window.PublicKeyCredential && PublicKeyCredential.signalAllAcceptedCredentials) {
        const credentialIds = currentList.map(c => c.id);
        if (!rpId || !isValidBase64Url(userId) || !credentialIds.every(isValidBase64Url)) {
          console.warn('SignalAllAcceptedCredentials skipped: server rpId and valid unpadded Base64URL userId and credential IDs are required.');
          return;
        }
        try {
          await PublicKeyCredential.signalAllAcceptedCredentials({
            rpId,
            userId,
            allAcceptedCredentialIds: credentialIds
          });
        } catch (e) {
          console.warn('SignalAllAcceptedCredentials sync warning:', e);
        }
      }
    }

    async function loadManagementUI() {
      const container = document.getElementById('list-container');
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Loading...';

      try {
        const response = await fetch('/api/credentials');
        if (!response.ok) throw new Error('Failed to load credentials');
        const payload = await response.json();
        const list = Array.isArray(payload) ? payload : (payload.credentials || []);
        if (payload.rpId) serverRpId = payload.rpId;
        if (payload.userId) serverUserId = payload.userId;
        
        container.innerHTML = '';
        if (list.length === 0) {
          container.innerHTML = '<div class="empty-state" data-testid="empty-state">No passkeys found.</div>';
          statusEl.textContent = 'Idle';
          await syncAcceptedCredentials(serverRpId, serverUserId, list);
          return;
        }

        list.forEach(cred => {
          // Zeroed AAGUID bypass lookup fallback rule
          let provider = { name: 'Unknown passkey provider' };
          if (cred.aaguid !== '00000000-0000-0000-0000-000000000000') {
            provider = aaguids[cred.aaguid] || { name: 'Unknown passkey provider' };
          }

          const item = document.createElement('div');
          item.className = 'credential-item';
          item.setAttribute('data-testid', `credential-item-${cred.id}`);
          
          const iconHtml = provider.icon_light
            ? `<img class="provider-icon" data-testid="provider-icon" src="${provider.icon_light}" alt="" width="32" height="32">`
            : '';
          const lastUsedHtml = cred.lastUsedAt
            ? `<span class="timestamp" data-testid="last-used">Last used: ${new Date(cred.lastUsedAt).toLocaleDateString()}</span>`
            : '';

          item.innerHTML = `
            <div class="credential-info">
              ${iconHtml}
              <div class="provider-details">
                <span class="provider-name" data-testid="provider-name">${cred.name || provider.name}</span>
                <span class="timestamp">Added: ${new Date(cred.registeredAt).toLocaleDateString()}</span>
                ${lastUsedHtml}
              </div>
            </div>
            <div>
              <button class="rename-btn" data-testid="rename-button-${cred.id}">Rename</button>
              <button class="delete-btn" data-testid="delete-button-${cred.id}">Delete</button>
            </div>
          `;
          
          // Wire action buttons
          item.querySelector('.rename-btn').addEventListener('click', () => performCredentialRename(cred.id));
          item.querySelector('.delete-btn').addEventListener('click', () => performDelete(cred.id));
          
          container.appendChild(item);
        });

        statusEl.textContent = 'Idle';
        // Sync on page load using server-provided rpId and userId
        await syncAcceptedCredentials(serverRpId, serverUserId, list);
      } catch (e) {
        console.error(e);
        statusEl.textContent = `Error: ${e.message}`;
      }
    }

    async function performCredentialRename(id) {
      const newName = prompt('Enter a custom passkey name:');
      if (!newName) return;
      
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Renaming passkey...';

      try {
        const response = await fetch(`/api/credential/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName })
        });
        
        if (response.ok) {
          statusEl.textContent = 'Passkey Renamed';
          await loadManagementUI();
        } else {
          throw new Error('Rename failed on server');
        }
      } catch (e) {
        console.error(e);
        statusEl.textContent = `Error: ${e.message}`;
      }
    }

    async function performUserRename() {
      const updatedDisplayName = prompt('Enter your updated display name:');
      if (!updatedDisplayName) return;

      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Updating profile...';

      try {
        const response = await fetch('/api/user', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'user@example.com', displayName: updatedDisplayName })
        });

        if (response.ok) {
          const updatedUser = await response.json();
          const rpId = updatedUser.rpId || serverRpId;
          const userId = updatedUser.userId || serverUserId;
          statusEl.textContent = 'Profile Updated';
          if (window.PublicKeyCredential && PublicKeyCredential.signalCurrentUserDetails) {
            if (!rpId || !isValidBase64Url(userId)) {
              console.warn('SignalCurrentUserDetails skipped: server rpId and valid unpadded Base64URL userId are required.');
            } else {
              try {
                await PublicKeyCredential.signalCurrentUserDetails({
                  rpId,
                  userId,
                  name: updatedUser.name || 'user@example.com',
                  displayName: updatedDisplayName
                });
              } catch (e) {
                console.warn('SignalCurrentUserDetails sync warning:', e);
              }
            }
          }
        } else {
          throw new Error('User profile update failed on server');
        }
      } catch (e) {
        console.error(e);
        statusEl.textContent = `Error: ${e.message}`;
      }
    }

    async function performDelete(id) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Deleting...';

      try {
        const response = await fetch(`/api/credential/${id}`, { method: 'DELETE' });
        if (response.ok) {
          statusEl.textContent = 'Passkey Deleted';
          // Re-query and Sync AllAcceptedCredentials list
          const updatedResponse = await fetch('/api/credentials');
          const payload = await updatedResponse.json();
          const updatedList = Array.isArray(payload) ? payload : (payload.credentials || []);
          const rpId = payload.rpId || serverRpId;
          const userId = payload.userId || serverUserId;
          renderUI(updatedList); // Visual helper
          await syncAcceptedCredentials(rpId, userId, updatedList);
        } else {
          throw new Error('Delete failed on server');
        }
      } catch (e) {
        console.error(e);
        statusEl.textContent = `Error: ${e.message}`;
      }
    }

    // Auxiliary visual renderer for deletions
    function renderUI(list) {
      const container = document.getElementById('list-container');
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state" data-testid="empty-state">No passkeys found.</div>';
        return;
      }
      // Basic render loop matching primary loads
      list.forEach(cred => {
        const item = document.createElement('div');
        item.className = 'credential-item';
        item.innerHTML = `
          <div class="credential-info"><span class="provider-name">${cred.name || 'iCloud Keychain'}</span></div>
        `;
        container.appendChild(item);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('rename-user-btn')?.addEventListener('click', performUserRename);
      gateCreatePasskeyButton();
      loadManagementUI();
    });
  </script>
</body>
</html>
