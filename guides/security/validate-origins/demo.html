<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Origin Comparison Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 680px;
      margin: 2rem auto;
      line-height: 1.5;
    }
    pre {
      background: #f4f4f5;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }
    iframe {
      display: none;
    }
    .tester {
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0.5rem 0;
    }
    input[type="text"] {
      flex: 1;
      min-width: 260px;
      padding: 0.4rem 0.6rem;
      font-family: monospace;
    }
    button {
      padding: 0.4rem 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Origin &amp; Site Comparison (`Origin` API)</h1>
  <p>
    Trusted reference origin: <code>https://app.trusted-origin.example</code>
    (trusted site domain: <code>trusted-origin.example</code>)
  </p>

  <section class="tester" aria-labelledby="interactive-heading">
    <h2 id="interactive-heading">Interactive Candidate Tester</h2>
    <div class="controls">
      <input
        id="candidate-input"
        data-testid="candidate-input"
        type="text"
        value="https://app.trusted-origin.example:443/account"
        aria-label="Candidate URL or origin"
      >
      <button id="btn-test-url" data-testid="test-url-button" type="button">Compare URL</button>
      <button id="btn-send-msg" data-testid="send-msg-button" type="button">Simulate postMessage</button>
    </div>
    <div class="controls">
      <button type="button" data-preset="https://app.trusted-origin.example:443/path">Same Origin (default :443)</button>
      <button type="button" data-preset="https://sub.trusted-origin.example:8443/checkout">Same Site Subdomain</button>
      <button type="button" data-preset="http://sub.trusted-origin.example/checkout">Scheme Downgrade (HTTP)</button>
      <button type="button" data-preset="https://app.trusted-origin.example.attacker.example">Prefix Spoof</button>
      <button type="button" data-preset="data:text/plain,hello">Opaque data: URL</button>
      <button type="button" data-preset="://not-a-valid-url">Malformed Input</button>
    </div>
    <pre id="interactive-result" data-testid="interactive-result"></pre>
  </section>

  <h2>Automated Verification Summary</h2>
  <a id="trusted-link" href="https://app.trusted-origin.example:443/account" hidden>Account</a>
  <iframe id="sandbox-a" sandbox="allow-scripts" srcdoc="<script>parent.postMessage({ source: 'sandbox-a', seq: 1 }, '*'); parent.postMessage({ source: 'sandbox-a', seq: 2 }, '*');</script>"></iframe>
  <iframe id="sandbox-b" sandbox="allow-scripts" srcdoc="<script>parent.postMessage({ source: 'sandbox-b', seq: 1 }, '*');</script>"></iframe>
  <pre id="output" data-testid="origin-output"></pre>

  <script type="module">
    const TRUSTED_ORIGIN_URL = 'https://app.trusted-origin.example';
    const TRUSTED_SITE_DOMAIN = 'trusted-origin.example';
    const SUBDOMAIN_URL = 'https://sub.trusted-origin.example:8443/checkout';
    const INSECURE_SUBDOMAIN_URL = 'http://sub.trusted-origin.example/checkout';
    const SAME_ORIGIN_PATH_URL = 'https://app.trusted-origin.example:443/path';
    const SPOOFED_PREFIX_URL = 'https://app.trusted-origin.example.attacker.example';
    const DATA_URL_A = 'data:text/plain,first';
    const DATA_URL_B = 'data:text/plain,second';
    const MALFORMED_URL = '://not-a-valid-url';

    function extractUrlString(candidate) {
      if (typeof candidate === 'string') return candidate;
      if (typeof MessageEvent !== 'undefined' && candidate instanceof MessageEvent) {
        return candidate.origin;
      }
      return candidate?.href ?? '';
    }

    function checkSameOrigin(candidate) {
      try {
        if ('Origin' in globalThis) {
          let candidateOrigin;
          try {
            candidateOrigin = Origin.from(candidate);
          } catch {
            candidateOrigin = Origin.from(extractUrlString(candidate));
          }
          return candidateOrigin.isSameOrigin(Origin.from(TRUSTED_ORIGIN_URL));
        }
        const candidateUrl = new URL(extractUrlString(candidate));
        const trustedUrl = new URL(TRUSTED_ORIGIN_URL);
        return candidateUrl.origin !== 'null' && candidateUrl.origin === trustedUrl.origin;
      } catch {
        return false;
      }
    }

    function checkSameSite(candidate) {
      try {
        if ('Origin' in globalThis) {
          let candidateOrigin;
          try {
            candidateOrigin = Origin.from(candidate);
          } catch {
            candidateOrigin = Origin.from(extractUrlString(candidate));
          }
          return candidateOrigin.isSameSite(Origin.from(TRUSTED_ORIGIN_URL));
        }
        const candidateUrl = new URL(extractUrlString(candidate));
        const trustedUrl = new URL(TRUSTED_ORIGIN_URL);
        return (
          candidateUrl.origin !== 'null' &&
          candidateUrl.protocol === trustedUrl.protocol &&
          (candidateUrl.hostname === TRUSTED_SITE_DOMAIN ||
            candidateUrl.hostname.endsWith(`.${TRUSTED_SITE_DOMAIN}`))
        );
      } catch {
        return false;
      }
    }

    const acceptedMessages = [];
    const rejectedMessages = [];
    const sandboxOrigins = {};

    function updateInteractiveResult(candidateValue) {
      let opaqueState = 'n/a (fallback)';
      if ('Origin' in globalThis) {
        try {
          opaqueState = String(Origin.from(candidateValue).opaque);
        } catch {
          opaqueState = 'invalid (Origin.from threw TypeError)';
        }
      }
      document.getElementById('interactive-result').textContent = [
        `Candidate: ${candidateValue}`,
        `isSameOrigin: ${checkSameOrigin(candidateValue)}`,
        `isSameSite:   ${checkSameSite(candidateValue)}`,
        `opaque:       ${opaqueState}`,
      ].join('\n');
    }

    function renderOutput() {
      const linkEl = document.getElementById('trusted-link');
      const lines = [
        `Trusted reference origin: ${TRUSTED_ORIGIN_URL}`,
        `Native Origin supported: ${'Origin' in globalThis}`,
        '',
        `sameOrigin(${SAME_ORIGIN_PATH_URL}): ${checkSameOrigin(SAME_ORIGIN_PATH_URL)}`,
        `sameOrigin(anchor#trusted-link): ${checkSameOrigin(linkEl)}`,
        `sameOrigin(${SUBDOMAIN_URL}): ${checkSameOrigin(SUBDOMAIN_URL)}`,
        `sameOrigin(${SPOOFED_PREFIX_URL}): ${checkSameOrigin(SPOOFED_PREFIX_URL)}`,
        `sameOrigin(${DATA_URL_A}): ${checkSameOrigin(DATA_URL_A)}`,
        `sameOrigin(${MALFORMED_URL}): ${checkSameOrigin(MALFORMED_URL)}`,
        '',
        `sameSite(${SUBDOMAIN_URL}): ${checkSameSite(SUBDOMAIN_URL)}`,
        `sameSite(${INSECURE_SUBDOMAIN_URL}): ${checkSameSite(INSECURE_SUBDOMAIN_URL)}`,
        `sameSite(${SPOOFED_PREFIX_URL}): ${checkSameSite(SPOOFED_PREFIX_URL)}`,
        `sameSite(${MALFORMED_URL}): ${checkSameSite(MALFORMED_URL)}`,
        '',
        `Accepted messages: ${acceptedMessages.join(', ')}`,
        `Rejected messages: ${rejectedMessages.join(', ')}`,
      ];

      if ('Origin' in globalThis) {
        const opaqueA = Origin.from(DATA_URL_A);
        const opaqueB = Origin.from(DATA_URL_B);
        lines.push(`opaqueA.opaque: ${opaqueA.opaque}`);
        lines.push(`opaqueA.isSameOrigin(opaqueB): ${opaqueA.isSameOrigin(opaqueB)}`);
        if (sandboxOrigins['sandbox-a-1'] && sandboxOrigins['sandbox-a-2'] && sandboxOrigins['sandbox-b-1']) {
          lines.push(
            `sandboxA1.isSameOrigin(sandboxA2): ${sandboxOrigins['sandbox-a-1'].isSameOrigin(sandboxOrigins['sandbox-a-2'])}`
          );
          lines.push(
            `sandboxA1.isSameOrigin(sandboxB1): ${sandboxOrigins['sandbox-a-1'].isSameOrigin(sandboxOrigins['sandbox-b-1'])}`
          );
        }
      }

      document.getElementById('output').textContent = lines.join('\n');
    }

    const candidateInput = document.getElementById('candidate-input');
    document.getElementById('btn-test-url').addEventListener('click', () => {
      updateInteractiveResult(candidateInput.value.trim());
    });
    document.getElementById('btn-send-msg').addEventListener('click', () => {
      const val = candidateInput.value.trim();
      window.dispatchEvent(
        new MessageEvent('message', {
          origin: val,
          data: { label: `interactive(${val})` },
        })
      );
      updateInteractiveResult(val);
    });
    for (const btn of document.querySelectorAll('[data-preset]')) {
      btn.addEventListener('click', () => {
        candidateInput.value = btn.dataset.preset;
        updateInteractiveResult(candidateInput.value);
      });
    }
    updateInteractiveResult(candidateInput.value);

    window.addEventListener('message', (event) => {
      if (event.data?.source?.startsWith('sandbox-')) {
        if ('Origin' in globalThis) {
          sandboxOrigins[`${event.data.source}-${event.data.seq}`] = Origin.from(event);
        }
        if (!checkSameOrigin(event)) {
          rejectedMessages.push(`${event.data.source}#${event.data.seq}`);
        }
        renderOutput();
        return;
      }

      if (checkSameOrigin(event)) {
        acceptedMessages.push(event.data?.label ?? event.origin);
      } else {
        rejectedMessages.push(event.data?.label ?? event.origin);
      }
      renderOutput();
    });

    window.dispatchEvent(
      new MessageEvent('message', {
        origin: TRUSTED_ORIGIN_URL,
        data: { label: 'trusted-msg' },
      })
    );
    window.dispatchEvent(
      new MessageEvent('message', {
        origin: SPOOFED_PREFIX_URL,
        data: { label: 'spoofed-msg' },
      })
    );
    window.dispatchEvent(
      new MessageEvent('message', {
        origin: 'null',
        data: { label: 'opaque-null-msg' },
      })
    );
  </script>
</body>
</html>
