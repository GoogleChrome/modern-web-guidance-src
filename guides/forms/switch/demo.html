<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Switch demo</title>

    <script>
        document.documentElement.classList.toggle(
            'no-native-switch',
            !('switch' in HTMLInputElement.prototype)
        );
    </script>

    <style>
        :root {
            color-scheme: light dark;
            --page-background: Canvas;
            --surface-background: Canvas;
            --text-color: CanvasText;
            --muted-color: GrayText;
            --border-color: #808080;
            --track-off: #e5e5e5;
            --accent-color: #1769e0;
            --focus-color: #ff8c00;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-block-size: 100vh;
            margin: 0;
            padding-block: 2rem;
            padding-inline: 1rem;
            background: var(--page-background);
            color: var(--text-color);
            font-family: system-ui, sans-serif;
            line-height: 1.5;
        }

        main {
            inline-size: min(100%, 42rem);
            margin-inline: auto;
        }

        .intro {
            color: var(--muted-color);
        }

        .switches {
            display: grid;
            gap: 1rem;
            margin-block: 2rem;
            padding: 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            background: var(--surface-background);
        }

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            cursor: pointer;
        }

        /* Native switch styling */
        html:where(:not(.no-native-switch)) input[type="checkbox"][switch] {
            accent-color: var(--accent-color);
            inline-size: 3rem;
            block-size: 1.75rem;
            margin: 0;
            cursor: pointer;
        }

        /* Focus outline for both native and polyfilled controls */
        input[type="checkbox"][switch]:focus-visible {
            outline: 3px solid var(--focus-color);
            outline-offset: 4px;
        }

        /* Polyfill: restyle the checkbox itself when native switch is unsupported */
        html.no-native-switch input[type="checkbox"][switch] {
            --switch-block-size: 1.75rem;
            --switch-inline-size: 3rem;
            --switch-border-size: 2px;
            --switch-thumb-size: calc(
                var(--switch-block-size) - (2 * var(--switch-border-size))
            );

            appearance: none;
            position: relative;
            flex: none;
            box-sizing: border-box;
            inline-size: var(--switch-inline-size);
            block-size: var(--switch-block-size);
            margin: 0;
            border: var(--switch-border-size) solid var(--border-color);
            border-radius: 999em;
            background-color: var(--track-off);
            cursor: pointer;
            transition: background-color 150ms ease, border-color 150ms ease;
        }

        html.no-native-switch input[type="checkbox"][switch]::before {
            position: absolute;
            inset-block-start: 0;
            inset-inline-start: 0;
            inline-size: var(--switch-thumb-size);
            block-size: var(--switch-thumb-size);
            border-radius: 50%;
            background-color: Canvas;
            box-shadow: 0 1px 3px rgb(0 0 0 / 25%);
            content: "";
            transition: inset-inline-start 150ms ease;
        }

        html.no-native-switch input[type="checkbox"][switch]:checked {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        html.no-native-switch input[type="checkbox"][switch]:checked::before {
            inset-inline-start: calc(100% - var(--switch-thumb-size));
        }

        @media (prefers-reduced-motion: reduce) {
            html.no-native-switch input[type="checkbox"][switch],
            html.no-native-switch input[type="checkbox"][switch]::before {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Switch demo</h1>

        <p class="intro">
            This example uses a standard checkbox with the HTML <code>switch</code> attribute,
            JavaScript feature detection, and a concise CSS polyfill for browsers lacking native support.
        </p>

        <section class="switches" aria-labelledby="switches-heading">
            <h2 id="switches-heading">Preferences</h2>

            <label class="setting">
                Enable notifications
                <input id="notifications" type="checkbox" role="switch" switch>
            </label>
        </section>
    </main>
</body>
</html>
