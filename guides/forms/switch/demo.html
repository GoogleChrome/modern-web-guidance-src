<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>User preferences demo</title>

    <style>
        :root {
            color-scheme: light dark;

            --page-background: #f5f7fa;
            --surface-background: #ffffff;
            --text-color: #17202a;
            --muted-color: #5b6773;
            --border-color: #c7d0d9;
            --accent-color: #1769e0;
            --focus-color: #ff8c00;
        }

        :root[data-theme="dark"] {
            --page-background: #15191d;
            --surface-background: #22282e;
            --text-color: #f1f4f6;
            --muted-color: #bbc4cc;
            --border-color: #56616b;
            --accent-color: #78aaff;
            --focus-color: #ffbd66;
        }

        :root[data-contrast="high"] {
            --page-background: #000000;
            --surface-background: #000000;
            --text-color: #ffffff;
            --muted-color: #ffffff;
            --border-color: #ffffff;
            --accent-color: #ffff00;
            --focus-color: #00ffff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-size: 100%;
        }

        html[data-text-size="large"] {
            font-size: 118%;
        }

        body {
            min-block-size: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            background: var(--page-background);
            color: var(--text-color);
            font-family: system-ui, sans-serif;
            line-height: 1.5;
        }

        main {
            inline-size: min(100%, 42rem);
            margin-inline: auto;
        }

        h1 {
            margin-block-start: 0;
        }

        .intro {
            color: var(--muted-color);
        }

        .preferences {
            display: grid;
            gap: 1rem;
            margin-block: 2rem;
        }

        .preference {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem;
        }

        .switches {
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            background: var(--surface-background);
        }

        .preference__description {
            display: grid;
            gap: 0.25rem;
        }

        .preference__description span {
            color: var(--muted-color);
            font-size: 0.9rem;
        }

        input[type="checkbox"][switch] {
            flex: 0 0 auto;
            inline-size: 3rem;
            block-size: 1.75rem;
            accent-color: var(--accent-color);
        }

        input[type="checkbox"][switch]:focus-visible {
            outline: 3px solid var(--focus-color);
            outline-offset: 4px;
        }

        .preview {
            padding: 1.5rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            background: var(--surface-background);
        }

        .preview__animation {
            inline-size: 4rem;
            block-size: 4rem;
            margin-block: 1rem;
            border-radius: 50%;
            background: var(--accent-color);
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        .status {
            margin-block-start: 1.5rem;
            color: var(--muted-color);
            font-size: 0.9rem;
        }

        @keyframes pulse {
            from {
                transform: scale(0.8);
                opacity: 0.5;
            }

            to {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        html[data-reduced-motion="true"] *,
        html[data-reduced-motion="true"] *::before,
        html[data-reduced-motion="true"] *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            scroll-behavior: auto !important;
            transition-duration: 0.001ms !important;
        }
    </style>
</head>
<body>
    <main>
        <h1>User preferences</h1>

        <p class="intro">
            Try changing these settings. Each preference applies immediately
            and is saved for your next visit.
        </p>

        <section class="preferences" aria-labelledby="preferences-heading">
            <div class="switches">
                <h2 id="preferences-heading">Appearance and accessibility</h2>
                <label class="preference">
                    <span class="preference__description">
                        <strong>Dark mode</strong>
                        <span>Use darker colours throughout the page.</span>
                    </span>

                    <input
                        id="dark-mode"
                        type="checkbox"
                        switch
                    >
                </label>

                <label class="preference">
                    <span class="preference__description">
                        <strong>Reduced motion</strong>
                        <span>Stop decorative animations.</span>
                    </span>

                    <input
                        id="reduced-motion"
                        type="checkbox"
                        switch
                    >
                </label>

                <label class="preference">
                    <span class="preference__description">
                        <strong>Larger text</strong>
                        <span>Increase the base text size.</span>
                    </span>

                    <input
                        id="large-text"
                        type="checkbox"
                        switch
                    >
                </label>

                <label class="preference">
                    <span class="preference__description">
                        <strong>High contrast</strong>
                        <span>Use stronger colours and borders.</span>
                    </span>

                    <input
                        id="high-contrast"
                        type="checkbox"
                        switch
                    >
                </label>
            </div>
        </section>

        <section class="preview" aria-labelledby="preview-heading">
            <h2 id="preview-heading">Live preview</h2>

            <p>
                This preview changes as you adjust your preferences.
            </p>

            <div
                class="preview__animation"
                aria-hidden="true"
            ></div>

            <p id="preference-status" class="status" aria-live="polite"></p>
        </section>
    </main>

    <script>
        const root = document.documentElement;
        const status = document.querySelector("#preference-status");

        const controls = {
            darkMode: document.querySelector("#dark-mode"),
            reducedMotion: document.querySelector("#reduced-motion"),
            largeText: document.querySelector("#large-text"),
            highContrast: document.querySelector("#high-contrast")
        };

        const operatingSystemPreferences = {
            darkMode: window.matchMedia("(prefers-color-scheme: dark)").matches,
            reducedMotion: window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches
        };

        function getPreference(name, fallback) {
            const savedValue = localStorage.getItem(`preference-${name}`);

            if (savedValue === null) {
                return fallback;
            }

            return savedValue === "true";
        }

        function savePreference(name, value) {
            localStorage.setItem(`preference-${name}`, value);
        }

        function applyPreferences() {
            const darkModeEnabled = controls.darkMode.checked;
            const reducedMotionEnabled = controls.reducedMotion.checked;
            const largeTextEnabled = controls.largeText.checked;
            const highContrastEnabled = controls.highContrast.checked;

            root.dataset.theme = darkModeEnabled ? "dark" : "light";
            root.dataset.reducedMotion = reducedMotionEnabled;
            root.dataset.textSize = largeTextEnabled ? "large" : "normal";
            root.dataset.contrast = highContrastEnabled ? "high" : "normal";

            status.textContent = [
                darkModeEnabled ? "Dark mode on" : "Dark mode off",
                reducedMotionEnabled
                    ? "reduced motion on"
                    : "reduced motion off",
                largeTextEnabled ? "larger text on" : "larger text off",
                highContrastEnabled
                    ? "high contrast on"
                    : "high contrast off"
            ].join("; ") + ".";
        }

        function initialise() {
            controls.darkMode.checked = getPreference(
                "dark-mode",
                operatingSystemPreferences.darkMode
            );

            controls.reducedMotion.checked = getPreference(
                "reduced-motion",
                operatingSystemPreferences.reducedMotion
            );

            controls.largeText.checked = getPreference(
                "large-text",
                false
            );

            controls.highContrast.checked = getPreference(
                "high-contrast",
                false
            );

            applyPreferences();
        }

        for (const [name, control] of Object.entries(controls)) {
            control.addEventListener("change", () => {
                savePreference(name, control.checked);
                applyPreferences();
            });
        }

        initialise();
    </script>
</body>
</html>
