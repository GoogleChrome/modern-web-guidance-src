<html lang="en">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IME-safe enter-to-submit demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    .chat-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow-y: auto;
      padding: 1rem;
      background: #f9f9f9;
      margin-bottom: 1rem;
      height: 300px;
    }
    .message {
      margin-bottom: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: #e1f5fe;
      border-radius: 4px;
      width: fit-content;
      max-width: 80%;
    }
    .message.sent {
      background: #e6f4ea;
      margin-left: auto;
    }
    .input-area {
      display: flex;
      gap: 0.5rem;
    }
    textarea {
      flex: 1;
      resize: vertical;
      min-height: 50px;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #1557b0;
    }
  </style>
</head>
<body>

  <h1>IME-safe enter-to-submit</h1>
  <p>Type a message below. Press <code>Enter</code> to submit, or <code>Shift + Enter</code> for a new line.</p>

  <div class="chat-box" id="chat-box">
    <div class="message">Welcome! Type a message below.</div>
  </div>

  <form id="chat-form" novalidate>
    <div class="input-area">
      <textarea id="chat-input" placeholder="Type a message..." aria-label="Message text field"></textarea>
      <button type="submit" id="send-btn">Send</button>
    </div>
  </form>

  <script>
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatBox = document.getElementById('chat-box');

    chatInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        // Prevent default newline behavior
        event.preventDefault();

        // IME composition active check
        if (event.isComposing || event.keyCode === 229) {
          // Do not submit while composition is active
          return;
        }

        chatForm.requestSubmit();
      }
    });

    chatForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message sent';
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      chatInput.value = '';
    });
  </script>
</body>
</html>
