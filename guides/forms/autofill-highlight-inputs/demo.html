<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Highlight Autofill Inputs</title>
  <style>
    input:autofill {
      box-shadow:
        inset 0 0 0 2px #2e7d32,
        inset 0 0 0 100vmax #e8f5e9;
      filter: none;
    }
  </style>
</head>
<body>
  <h1>Name Form</h1>
  <form id="form" name="form">
    <div>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="100" pattern="[\p{L} \-\.]+" required>
    </div>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
