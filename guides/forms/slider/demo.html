<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand-Consistent Slider Demo</title>
  <style>
    :root {
      --background: #fff;
      --text: #111;
      --card-bg: rgb(0 0 0 / 5%);
      --brand-color: #06c;
      --track-bg: #d9d9d9;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #121212;
        --text: #eee;
        --card-bg: rgb(255 255 255 / 5%);
        --brand-color: #66b3ff;
        --track-bg: #404040;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-block-size: 80vh;
      place-items: center;
      margin: 0;
      padding: 2rem;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    .slider-card {
      display: flex;
      inline-size: min(100%, 25rem);
      flex-direction: column;
      gap: 1.5rem;
      padding: 2rem;
      border-radius: 0.75rem;
      background: var(--card-bg);
      box-shadow: 0 0.25rem 0.75rem rgb(0 0 0 / 10%);
    }

    .slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    label,
    .value-display {
      font-size: 1.1rem;
      font-weight: 600;
    }

    label {
      cursor: pointer;
    }

    .value-display {
      color: var(--brand-color);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      --slider-track-size: 0.5rem;
      --slider-thumb-size: 1.25rem;
      --slider-track-color: var(--track-bg);
      --slider-fill-color: var(--brand-color);
      --slider-thumb-color: var(--slider-fill-color);
      --slider-progress: 0%;
      --slider-direction: to right;

      appearance: none;
      inline-size: 100%;
      block-size: 2.5rem;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: linear-gradient(var(--slider-direction),
          var(--slider-fill-color) var(--slider-progress),
          var(--slider-track-color) var(--slider-progress)) center / 100% var(--slider-track-size) no-repeat;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      block-size: var(--slider-track-size);
      border: 0;
      border-radius: 999px;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      inline-size: var(--slider-thumb-size);
      block-size: var(--slider-thumb-size);
      margin-block-start: calc((var(--slider-track-size) - var(--slider-thumb-size)) / 2);
      border: 0;
      border-radius: 50%;
      background: var(--slider-thumb-color);
    }

    input[type="range"]::-moz-range-track {
      block-size: var(--slider-track-size);
      border: 0;
      border-radius: 999px;
      background: transparent;
    }

    input[type="range"]::-moz-range-progress {
      block-size: var(--slider-track-size);
      border-radius: 999px;
      background: var(--slider-fill-color);
    }

    input[type="range"]::-moz-range-thumb {
      inline-size: var(--slider-thumb-size);
      block-size: var(--slider-thumb-size);
      border: 0;
      border-radius: 50%;
      background: var(--slider-thumb-color);
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--slider-fill-color);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      input[type="range"] {
        scroll-behavior: auto;
      }
    }

    [dir="rtl"] input[type="range"] {
      --slider-direction: to left;
    }
  </style>
</head>

<body>
  <main class="slider-card">
    <div class="slider-header">
      <label id="volume-label" for="volume-slider">Volume</label>
      <output id="value-display" class="value-display" for="volume-slider">70%</output>
    </div>

    <input type="range" id="volume-slider" aria-labelledby="volume-label" min="0" max="100" value="70" step="1" />
  </main>

  <script>
    const slider = document.getElementById('volume-slider');
    const valueDisplay = document.getElementById('value-display');

    function updateSlider() {
      const min = Number(slider.min || 0);
      const max = Number(slider.max || 100);
      const value = Number(slider.value);
      const progress = max > min
        ? ((value - min) / (max - min)) * 100
        : 0;
      const formattedValue = `${value}%`;

      slider.style.setProperty('--slider-progress', `${progress}%`);
      valueDisplay.value = formattedValue;
      valueDisplay.textContent = formattedValue;
      slider.setAttribute('aria-valuetext', formattedValue);
    }

    updateSlider();
    slider.addEventListener('input', updateSlider);
  </script>
</body>

</html>
