<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Button Group Demo</title>
    <style>
      @layer demo {
        :root {
          --button-radius: 8px;
          --brand-blue: #0056b3;
          --brand-hover: #f0f7ff;
          --focus-gold: #ffc107;
        }

        body {
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
          padding: 2rem;
          line-height: 1.5;
        }
        .field {
          margin-bottom: 2.5rem;
        }

        .field label {
          display: block;
          margin-bottom: 0.25rem;
          font-weight: bold;
          font-size: 1.1rem;
        }

        .hint {
          font-size: 0.9rem;
          color: #555;
          margin-bottom: 1rem;
          display: block;
        }
      }

      @layer component {
        .button-group select {
          display: none;
        }
        @supports (appearance: base-select) {
          .button-group select {
            display: block;
          }
          .button-group .buttons {
            display: none;
          }
        }
        .wrapper,
        .buttons {
          display: flex;
          background: #eee;
          padding: 4px;
          border-radius: calc(var(--button-radius) + 4px);
          inline-size: max-content;
          block-size: min-content;
        }
        option,
        button {
          padding: 0.6rem 1.2rem;
          border: 1px solid var(--brand-blue);
          border-inline-end-width: 0;
          background: white;
          color: var(--brand-blue);
          transition: all 0.2s ease;
          text-align: center;
          font-weight: 500;
        }
        option:first-of-type,
        button:first-of-type {
          border-radius: var(--button-radius) 0 0 var(--button-radius);
        }

        option:last-of-type,
        button:last-of-type {
          border-radius: 0 var(--button-radius) var(--button-radius) 0;
          border-inline-end-width: 1px;
        }

        option:hover,
        button:hover {
          background: var(--brand-hover);
          color: #004494;
          text-decoration: underline;
        }

        option:checked,
        button[aria-pressed="true"] {
          background: var(--brand-blue);
          color: white;
        }

        option:focus-visible,
        button:focus-visible {
          outline: 3px solid var(--focus-gold);
          outline-offset: -3px;
        }
      }

      @layer component.modern {
        @supports (appearance: base-select) {
          select {
            appearance: base-select;
            border: none;
            background: transparent;
            padding: 0;
          }

          option {
            appearance: none;
          }

          option::checkmark {
            display: none;
          }
        }
      }
      @layer component.fallback {
        @supports not (appearance: base-select) {
          .button-group {
            button {
              all: unset;
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <h1>Button Group Demo</h1>

    <div class="field">
      <label for="view-select" id="view-select-label">Layout View</label>
      <span class="hint"
        >Select a single option to change the display mode.</span
      >
      <div class="button-group">
        <select id="view-select" size="4" required name="view">
          <div class="wrapper">
            <option value="grid" selected>Grid</option>
            <option value="feed">Feed</option>
            <option value="stack">Stack</option>
            <option value="list">List</option>
          </div>
        </select>
        <div
          class="buttons"
          role="listbox"
          aria-labelledby="view-select-label"
          aria-required="true"
        >
          <button role="option" type="button" value="grid" aria-pressed="true">
            Grid
          </button>
          <button role="option" type="button" value="feed">Feed</button>
          <button role="option" type="button" value="stack">Stack</button>
          <button role="option" type="button" value="list">List</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="decoration-select" id="decoration-label"
        >Text Formatting</label
      >
      <span id="multi-hint" class="hint">Multiple selection allowed.</span>
      <div class="button-group multiple">
        <select
          id="decoration-select"
          multiple
          aria-describedby="multi-hint"
          name="decoration"
        >
          <div class="wrapper">
            <option value="bold">Bold</option>
            <option value="underline">Underline</option>
            <option value="strikethrough">Strikethrough</option>
          </div>
        </select>
        <div
          class="buttons multiple"
          aria-labelledby="decoration-label"
          aria-multiselectable="true"
        >
          <button role="option" type="button" value="bold">Bold</button>
          <button role="option" type="button" value="underline">
            Underline
          </button>
          <button role="option" type="button" value="strikethrough">
            Strikethrough
          </button>
        </div>
      </div>
    </div>
    <script>
      const addLeftRight = (select) => {
        select.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
            const options = select.options;
            const focused = [...options].findIndex(
              (option) => option === document.activeElement,
            );
            const nextIndex =
              event.key === "ArrowLeft"
                ? Math.max(0, focused - 1)
                : Math.min(options.length - 1, focused + 1);
            options[nextIndex].focus();
          }
        });
      };

      const trackButtons = (div) => {
        const buttons = div.querySelectorAll("button");
        const multiple = div.classList.contains("multiple");
        buttons.forEach((button) => {
          button.addEventListener("click", (event) => {
            const isSelected = event.target.ariaPressed === "true";
            if (multiple) {
              event.target.ariaPressed = isSelected ? "false" : "true";
            } else {
              buttons.forEach((btn) => (btn.ariaPressed = btn === event.target));
            }
          });
        });
      };

      document.querySelectorAll(".button-group").forEach((group) => {
        if (CSS.supports("appearance: base-select")) {
          addLeftRight(group.querySelector("select"));
        } else {
          trackButtons(group.querySelector(".buttons"));
        }
      });
    </script>
  </body>
</html>
