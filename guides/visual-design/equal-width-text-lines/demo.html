<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equal-Width Text Lines</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        display: grid;
        gap: 3rem;
        background: #f8fafc;
        color: #0f172a;
      }

      /* Drag the corner of each poster to see the lines refit */
      .poster {
        width: min(100%, 24rem);
        min-width: 10rem;
        max-width: 100%;
        padding: 1.5rem;
        border: 2px solid #0f172a;
        background: white;
        resize: horizontal;
        overflow: auto;
      }

      .lockup {
        /* Each line grows until it spans the poster's inline size.
           The percentage caps the growth so a short line can't become absurdly large.
           Tune it to the copy: "Sale" needs almost 5x here, so 300% would stop it short. */
        text-fit: grow per-line-all 500%;

        /* Base size: what scaling starts from, and what unsupporting browsers render */
        font-size: 2rem;
        font-weight: 800;

        span {
          font-weight: calc(800 * pow(2rem / 1lh, .2));
        }

        /* Unitless so the leading scales with each line's own text.
           Tight for all-caps lockups without lines touching. */
        line-height: 0.9;
        text-transform: uppercase;
        margin: 0;
      }

      /* Fixed lockup: one block per line */
      .lockup > span {
        display: block;
      }

      /* Dynamic copy: balance the line lengths first, then each line scales */
      .lockup.dynamic {
        text-wrap: balance;
      }

      /* Fallback for browsers without text-fit: shrink-wrap each line so its
         width is the text width, which the script below measures */
      @supports not (text-fit: grow) {
        .lockup > span {
          width: fit-content;
          white-space: nowrap;
          /* --text-fit-scale is measured by the script; the cap mirrors the text-fit percentage */
          font-size: min(var(--text-fit-scale, 1) * 1em, 500%);
        }
      }

      p {
        margin: 0 0 1rem;
        max-width: 60ch;
      }
    </style>
  </head>
  <body>
    <section>
      <p>Fixed lockup: one block per line. Resize the poster and every line stays edge to edge.</p>
      <div class="poster">
        <h1 class="lockup">
          <span>Summer</span>
          <span>Sale</span>
          <span>Up to fifty percent</span>
          <span>Ends Sunday</span>
        </h1>
      </div>
    </section>

    <section>
      <p>Dynamic copy: the text wraps naturally, <code>text-wrap: balance</code> evens out the lines, then each line scales.</p>
      <div class="poster">
        <h2 class="lockup dynamic">The quick brown fox jumps over the lazy dog</h2>
      </div>
    </section>

    <script type="module">
      // Fallback for browsers without text-fit: measure each fixed line at its
      // base size and scale it by the ratio to the container, with the same cap.
      if (!CSS.supports('text-fit', 'grow per-line-all')) {
        const fit = lockup => {
          const lines = [...lockup.querySelectorAll(':scope > span')];
          // Unscale first: on a refit, offsetWidth would otherwise include the previous scale
          for (const line of lines) line.style.removeProperty('--text-fit-scale');
          const scales = lines.map(line => lockup.clientWidth / line.offsetWidth);
          lines.forEach((line, i) => line.style.setProperty('--text-fit-scale', scales[i]));
        };

        // Refit when the container resizes (viewport, drag handle, font load)
        for (const lockup of document.querySelectorAll('.lockup')) {
          new ResizeObserver(() => fit(lockup)).observe(lockup);
        }
      }
    </script>
  </body>
</html>
