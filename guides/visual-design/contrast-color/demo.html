<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contrast-color() Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #f0f0f0;
        color: #333;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      h1 {
        margin-bottom: 2rem;
        text-align: center;
      }

      .container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 800px;
      }

      .badge,
      .button,
      .theme-card {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-weight: bold;
        box-shadow: 0 4px 6px rgb(0 0 0 / 0.1);
      }

      .badge {
        width: 120px;
        height: 120px;
        font-size: 1.1rem;
        background-color: var(--badge-bg);
        /* Default assumption + Readability safety net for older browsers */
        color: #fff;
        text-shadow: 0 1px 3px rgb(0 0 0 / 0.8);
      }

      .button {
        padding: 12px 24px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        font-family: inherit;
        --button-bg: #b2aeff;
        background-color: var(--button-bg);
        --button-color: #000;
        color: var(--button-color);
      }
      .button:is(:hover, :focus) {
        --button-bg: #3e3a87;
        --button-color: #fff; /* Safe fallback */
      }

      .theme-card {
        padding: 20px;
        width: 180px;
        background-color: var(--theme-surface-color);
        color: var(--theme-on-surface-color);
      }

      .theme-container[data-theme="light"] {
        --theme-surface-color: #f4f4f4;
        --theme-on-surface-color: #000;
      }
      .theme-container[data-theme="dark"] {
        --theme-surface-color: #1a1a1a;
        --theme-on-surface-color: #fff;
      }

      /* Fallback using relative color syntax  */
      @supports (color: oklch(from red l c h)) {
        .badge {
          /* Highest threshold that passes WCAG. Higher values may be more legible. */
          --threshold: 0.623;
          --l: clamp(0, (l / var(--threshold) - 1) * -infinity, 1);
          color: oklch(from var(--badge-bg) var(--l) 0 h);
          text-shadow: none;
        }
      }

      /* Apply dynamic contrasting color only if supported */
      @supports (color: contrast-color(red)) {
        .badge {
          color: contrast-color(var(--badge-bg));
          text-shadow: none;
        }

        .button {
          color: contrast-color(var(--button-bg));
        }

        .button:is(:hover, :focus) {
          --button-bg: #3e3a87;
        }

        .theme-card {
          color: contrast-color(var(--theme-surface-color));
        }
      }

      /* Define different backgrounds for testing */
      .badge-dark {
        --badge-bg: #1a1a1a;
      }
      .badge-light {
        --badge-bg: #f9f9f9;
      }
      .badge-color {
        --badge-bg: #e02424;
      }
    </style>
  </head>
  <body>
    <h1>Dynamic Contrast using <code>contrast-color()</code></h1>

    <div class="container">
      <div class="badge badge-dark" data-testid="badge-dark">Dark Bg</div>
      <div class="badge badge-light" data-testid="badge-light">Light Bg</div>
      <div class="badge badge-color" data-testid="badge-color">Color Bg</div>

      <button class="button" data-testid="button-hover">Hover Me</button>

      <div class="theme-container" data-theme="light">
        <div class="theme-card" data-testid="theme-card-light">Light Theme</div>
      </div>
      <div class="theme-container" data-theme="dark">
        <div class="theme-card" data-testid="theme-card-dark">Dark Theme</div>
      </div>
    </div>
  </body>
</html>
