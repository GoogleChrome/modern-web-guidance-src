<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <title>Scrollbar Implementation</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 50px;
            background: #eee;
        }

        .scroll-box {
            width: 300px;
            height: 200px;
            overflow-y: scroll;
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
        }

        .scroll-box::-webkit-scrollbar {
            width: 15px;
        }

        .scroll-box::-webkit-scrollbar-track {
            background: #ff0000;
        }

        .scroll-box::-webkit-scrollbar-thumb {
            background: #00ff00;
            border: 2px solid #ff0000;
        }

        .scroll-box::-webkit-scrollbar-thumb:hover {
            background: #00dd00;
        }

<body>
