<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3157d5">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Install a web application</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-block-size: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        inline-size: min(32rem, calc(100% - 2rem));
      }

      .install-options {
        display: grid;
        gap: 1.5rem;
      }

      section {
        padding: 1.25rem;
        border: 1px solid currentColor;
        border-radius: 0.75rem;
      }

      button {
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.4rem;
        background: #3157d5;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Install this app</h1>
      <p>
        Add this app to your device for quicker access from your applications.
      </p>

      <div class="install-options">
        <section>
          <h2>Browser-provided control</h2>
          <p>The browser controls the appearance and installation prompt.</p>
          <install></install>
          <p id="browser-install-status" role="status"></p>
        </section>

        <section>
          <h2>Custom control</h2>
          <p>This control appears only when installation can be requested.</p>
          <button id="custom-install-app" type="button" hidden>Install app</button>
          <p id="custom-install-status" role="status"></p>
        </section>
      </div>
    </main>

    <script type="module">
      const installButton = document.querySelector("install");
      const installStatus = document.querySelector("#browser-install-status");
      const customInstallButton = document.querySelector("#custom-install-app");
      const customInstallStatus = document.querySelector("#custom-install-status");
      const supportsWebInstall =
        typeof Navigator.prototype.install === "function";
      let deferredInstallPrompt;

      installButton.addEventListener("installresult", (event) => {
        switch (event.result) {
          case "success":
            installStatus.textContent = "The app was installed.";
            break;
          case "aborted":
            installStatus.textContent =
              "Installation was canceled or could not complete.";
            break;
          case "invalid_data":
            installStatus.textContent =
              "Installation could not start because the app data is invalid.";
            break;
        }
      });

      if (supportsWebInstall) {
        customInstallButton.hidden = false;
      }

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;

        if (!supportsWebInstall) {
          customInstallButton.hidden = false;
        }
      });

      customInstallButton.addEventListener("click", async () => {
        customInstallButton.disabled = true;

        try {
          if (supportsWebInstall) {
            // Calling directly from this handler preserves transient user activation.
            await navigator.install();
            customInstallStatus.textContent = "The app was installed.";
            customInstallButton.hidden = true;
          } else if (deferredInstallPrompt) {
            // Clear the single-use event before awaiting the user's choice.
            const promptEvent = deferredInstallPrompt;
            deferredInstallPrompt = undefined;
            promptEvent.prompt();
            const { outcome } = await promptEvent.userChoice;
            customInstallStatus.textContent =
              outcome === "accepted"
                ? "The app was installed."
                : "Installation canceled.";

            customInstallButton.hidden = true;
          }
        } catch (error) {
          if (error.name === "AbortError") {
            customInstallStatus.textContent = "Installation was canceled or could not complete.";
            customInstallButton.hidden = true;
          } else {
            customInstallStatus.textContent = "Installation could not start.";
            console.error(error);
          }
        } finally {
          customInstallButton.disabled = false;
        }
      });

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = undefined;
        customInstallButton.hidden = true;
        customInstallStatus.textContent = "The app was installed.";
      });
    </script>
  </body>
</html>
